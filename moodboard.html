<style>
  :root{
    --mb-bg:#0a0a0a;
    --mb-line:rgba(255,255,255,.12);
    --mb-text:#efe9df;
    --mb-muted:#8f9296;
    --mb-accent:#4d7ea8;
  }
  .mb-page{
    background:var(--mb-bg);
    color:var(--mb-text);
    padding:130px 24px 140px;
    min-height:100vh;
  }
  .mb-head{
    max-width:1700px;
    margin:0 auto 40px;
    text-align:center;
  }
  .mb-eyebrow{
    font-family:'Archivo',sans-serif;
    font-size:.72rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--mb-muted);
    margin:0 0 10px;
  }
  .mb-title{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-weight:300;
    font-size:clamp(2.4rem,5vw,4rem);
    margin:0 0 14px;
  }
  .mb-sub{
    font-family:'Archivo',sans-serif;
    font-weight:300;
    color:var(--mb-muted);
    max-width:520px;
    margin:0 auto 28px;
    line-height:1.6;
    font-size:.95rem;
  }
  .mb-btn-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
  }
  .mb-upload-btn,
  .mb-text-btn,
  .mb-video-btn,
  .mb-box-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:'Archivo',sans-serif;
    font-size:.85rem;
    letter-spacing:.04em;
    padding:12px 24px;
    border-radius:2px;
    cursor:pointer;
    transition:opacity .2s ease, border-color .2s ease;
  }
  .mb-upload-btn{
    color:var(--mb-bg);
    background:var(--mb-accent);
  }
  .mb-text-btn,
  .mb-video-btn,
  .mb-box-btn{
    color:var(--mb-text);
    background:transparent;
    border:1px solid var(--mb-line);
  }
  .mb-upload-btn:hover,
  .mb-text-btn:hover,
  .mb-video-btn:hover,
  .mb-box-btn:hover{ opacity:.85; }
  .mb-text-btn:hover,
  .mb-video-btn:hover,
  .mb-box-btn:hover{ border-color:var(--mb-accent); }
  .mb-status{
    font-family:'Archivo',sans-serif;
    font-size:.75rem;
    color:var(--mb-muted);
    margin-top:14px;
    min-height:1em;
  }

  .mb-canvas{
    position:relative;
    max-width:1700px;
    margin:0 auto;
    min-height:1500px;
    background-image:radial-gradient(var(--mb-line) 1px, transparent 1px);
    background-size:28px 28px;
    border:1px solid var(--mb-line);
    overflow:hidden;
  }
  .mb-canvas.mb-dragover{
    border-color:var(--mb-accent);
    box-shadow:inset 0 0 0 1px var(--mb-accent);
  }
  .mb-dropcue{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Archivo',sans-serif;
    font-size:.85rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--mb-accent);
    opacity:0;
    pointer-events:none;
    transition:opacity .15s ease;
  }
  .mb-canvas.mb-dragover .mb-dropcue{ opacity:1; }
  .mb-empty{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Archivo',sans-serif;
    font-size:.8rem;
    letter-spacing:.04em;
    color:var(--mb-muted);
    text-align:center;
    padding:20px;
  }

  .mb-item{
    position:absolute;
    background:#111;
    border:1px solid var(--mb-line);
    padding:6px;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
    cursor:grab;
    touch-action:none;
    user-select:none;
  }
  .mb-item.mb-dragging{ cursor:grabbing; box-shadow:0 16px 40px rgba(0,0,0,.65); }
  .mb-item img{
    display:block;
    width:100%;
    height:auto;
    pointer-events:none;
  }
  .mb-delete{
    position:absolute;
    top:-9px; right:-9px;
    width:22px; height:22px;
    border-radius:50%;
    border:1px solid var(--mb-line);
    background:#0a0a0a;
    color:var(--mb-text);
    font-size:14px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    opacity:0;
    transition:opacity .15s ease;
  }
  .mb-item:hover .mb-delete,
  .mb-item:focus-within .mb-delete{ opacity:1; }
  .mb-resize{
    position:absolute;
    right:2px; bottom:2px;
    width:14px; height:14px;
    cursor:nwse-resize;
    background:linear-gradient(135deg, transparent 50%, var(--mb-accent) 50%);
    opacity:0;
    transition:opacity .15s ease;
  }
  .mb-item:hover .mb-resize,
  .mb-item:focus-within .mb-resize{ opacity:.8; }

  .mb-item-text{
    background:rgba(255,255,255,.03);
    border:1px dashed var(--mb-line);
    padding:0;
    min-width:120px;
  }
  .mb-drag-handle{
    height:14px;
    cursor:grab;
    background:repeating-linear-gradient(
      90deg, var(--mb-line) 0 3px, transparent 3px 7px
    );
    opacity:.5;
  }
  .mb-item-text.mb-dragging .mb-drag-handle{ cursor:grabbing; }
  .mb-text-content{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-weight:400;
    font-size:1.15rem;
    line-height:1.5;
    color:var(--mb-text);
    padding:10px 14px 14px;
    min-height:1.5em;
    outline:none;
    cursor:text;
    user-select:text;
  }
  .mb-text-content:empty::before{
    content:attr(data-placeholder);
    color:var(--mb-muted);
  }

  .mb-item video{
    display:block;
    width:100%;
    height:auto;
    pointer-events:none;
  }
  .mb-play{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:46px; height:46px;
    border-radius:50%;
    background:rgba(10,10,10,.6);
    border:1px solid var(--mb-line);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:var(--mb-text);
    padding:0;
    transition:background .15s ease;
  }
  .mb-play:hover{ background:rgba(10,10,10,.82); }
  .mb-play svg{ width:16px; height:16px; display:block; }

  .mb-item-box{
    padding:0;
    box-shadow:none;
  }
  .mb-item-box.mb-dragging{ box-shadow:none; }
  .mb-box-label{
    position:absolute;
    top:12px; left:16px;
    right:46px;
    font-family:'Archivo',sans-serif;
    font-size:.72rem;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--mb-text);
    outline:none;
    cursor:text;
  }
  .mb-box-label:empty::before{
    content:attr(data-placeholder);
    color:var(--mb-muted);
  }
  .mb-box-swatch{
    position:absolute;
    top:-9px; left:-9px;
    width:22px; height:22px;
    border-radius:50%;
    border:1px solid var(--mb-line);
    cursor:pointer;
    opacity:0;
    transition:opacity .15s ease;
  }
  .mb-item-box:hover .mb-box-swatch,
  .mb-item-box:focus-within .mb-box-swatch{ opacity:1; }
  .mb-item-box .mb-resize{
    background:linear-gradient(135deg, transparent 50%, var(--mb-line) 50%);
  }

  @media (max-width:720px){
    .mb-page{ padding-top:110px; }
    .mb-canvas{ min-height:1000px; }
  }
</style>

<section class="mb-page">
  <div class="mb-head">

    <h1 class="mb-title">Moodboard</h1>
    <p class="mb-sub">Dra och släpp bilder eller video var du vill på tavlan, eller lägg till
      text och kapitelramar. Dra i hörnet för att ändra storlek. Layouten sparas automatiskt.</p>
    <div class="mb-btn-row">
      <label class="mb-upload-btn">
        + Lägg till bilder
        <input type="file" id="mb-file-input" accept="image/*" multiple hidden>
      </label>
      <label class="mb-video-btn">
        + Lägg till video
        <input type="file" id="mb-video-input" accept="video/*" multiple hidden>
      </label>
      <button type="button" class="mb-text-btn" id="mb-text-btn">+ Lägg till text</button>
      <button type="button" class="mb-box-btn" id="mb-box-btn">+ Lägg till ram</button>
    </div>
    <p class="mb-status" id="mb-status"></p>
  </div>

  <div class="mb-canvas" id="mb-canvas">
    <div class="mb-dropcue" id="mb-dropcue">Släpp bilderna här</div>

<script src="js/header.js"></script>
<script>
(function () {
  const canvas = document.getElementById('mb-canvas');
  const fileInput = document.getElementById('mb-file-input');
  const videoInput = document.getElementById('mb-video-input');
  const textBtn = document.getElementById('mb-text-btn');
  const boxBtn = document.getElementById('mb-box-btn');
  const statusEl = document.getElementById('mb-status');
  const API = '/.netlify/functions/';

  // Håll videofiler små — JSON+base64 innebär ~33% extra storlek
  // och funktionsanropet har ett tak, så vi stoppar för stora filer
  // innan uppladdning istället för att låta dem misslyckas tyst.
  const MAX_VIDEO_BYTES = 4 * 1024 * 1024;

  const BOX_PALETTE = ['#4d7ea8', '#a8664d', '#4d8a6b', '#7a5ba0', '#6b6b63'];
  let paletteIdx = 0;
  function nextBoxColor() {
    const c = BOX_PALETTE[paletteIdx % BOX_PALETTE.length];
    paletteIdx++;
    return c;
  }
  function hexToRgba(hex, alpha) {
    const h = hex.replace('#', '');
    const r = parseInt(h.substring(0, 2), 16);
    const g = parseInt(h.substring(2, 4), 16);
    const b = parseInt(h.substring(4, 6), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
  }
  function applyBoxColor(el, swatch, hex) {
    el.style.background = hexToRgba(hex, .3);
    el.style.border = '2px solid ' + hex;
    if (swatch) swatch.style.background = hex;
  }

  const PLAY_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  const PAUSE_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>';

  let maxZ = 1;
  let minZ = 0;
  let contentBottom = 400;

  // .mb-canvas har overflow:hidden och alla kort är position:absolute,
  // så de bidrar INTE automatiskt till canvasens egen höjd — utan
  // det här skulle allt under min-height (1500px) klippas bort och
  // bli osynligt. Vi håller canvasen minst lika hög som innehållet.
  function growCanvas() {
    const needed = contentBottom + 200;
    const current = parseInt(canvas.style.minHeight || '1500', 10);
    if (needed > current) canvas.style.minHeight = needed + 'px';
  }
  let itemCount = 0;

  function setStatus(msg, isError) {
    statusEl.textContent = msg || '';
    statusEl.style.color = isError ? '#c0664f' : '';
  }

  function showEmptyState() {
    if (itemCount > 0) return;
    if (canvas.querySelector('.mb-empty')) return;
    const el = document.createElement('div');
    el.className = 'mb-empty';
    el.textContent = 'Inget här ännu — lägg till bilder, video, text eller en ram för att börja bygga tavlan.';
    canvas.appendChild(el);
  }
  function hideEmptyState() {
    const el = canvas.querySelector('.mb-empty');
    if (el) el.remove();
  }

  // ── Ladda in befintlig layout ─────────────────────────
  async function loadBoard() {
    try {
      const res = await fetch(API + 'moodboard-hamta');
      if (!res.ok) throw new Error('Kunde inte hämta moodboarden');
      const items = await res.json();
      items.forEach((item) => {
        if (item.z > maxZ) maxZ = item.z;
        if (item.z < minZ) minZ = item.z;
        renderItem(item);
      });
      if (items.length === 0) showEmptyState();
    } catch (err) {
      console.error(err);
      setStatus('Kunde inte läsa in moodboarden. Ladda om sidan.', true);
    }
  }

  // ── Bygg ett kort (bild, video, text eller ram) ────────
  function renderItem(item) {
    hideEmptyState();
    itemCount++;

    const isText = item.type === 'text';
    const isVideo = item.type === 'video';
    const isBox = item.type === 'box';

    const el = document.createElement('div');
    el.className = 'mb-item' +
      (isText ? ' mb-item-text' : '') +
      (isBox ? ' mb-item-box' : '');
    el.style.left = item.x + 'px';
    el.style.top = item.y + 'px';
    el.style.width = item.w + 'px';
    if (isBox) el.style.height = (item.h || 320) + 'px';
    el.style.zIndex = item.z;

    const estH = isBox ? (item.h || 320) : (isText ? 90 : Math.round(item.w * 0.72));
    if (item.y + estH > contentBottom) {
      contentBottom = item.y + estH;
      growCanvas();
    }

    const del = document.createElement('button');
    del.className = 'mb-delete';
    del.type = 'button';
    del.setAttribute('aria-label', 'Ta bort');
    del.textContent = '\u00D7';

    const handle = document.createElement('div');
    handle.className = 'mb-resize';

    let dragTarget = el;
    let swatch = null;

    if (isText) {
      const dragHandle = document.createElement('div');
      dragHandle.className = 'mb-drag-handle';
      dragTarget = dragHandle;

      const content = document.createElement('div');
      content.className = 'mb-text-content';
      content.contentEditable = 'true';
      content.setAttribute('data-placeholder', 'Skriv något …');
      content.textContent = item.content || '';

      content.addEventListener('pointerdown', (e) => e.stopPropagation());
      content.addEventListener('focus', () => { activeTextItem = item; activeTextEl = content; });
      content.addEventListener('input', () => {
        item.content = content.textContent;
        clearTimeout(textSaveTimer);
        textSaveTimer = setTimeout(() => saveText(item), 700);
      });
      content.addEventListener('blur', () => {
        clearTimeout(textSaveTimer);
        item.content = content.textContent;
        saveText(item);
        if (activeTextEl === content) { activeTextItem = null; activeTextEl = null; }
      });

      el.appendChild(dragHandle);
      el.appendChild(content);

      // Fokusera direkt på nyskapade, tomma textkort
      if (!item.content) {
        requestAnimationFrame(() => content.focus());
      }
    } else if (isVideo) {
      const video = document.createElement('video');
      video.src = API + 'moodboard-bild?id=' + encodeURIComponent(item.id);
      video.preload = 'metadata';
      video.playsInline = true;
      video.setAttribute('playsinline', '');

      const playBtn = document.createElement('button');
      playBtn.type = 'button';
      playBtn.className = 'mb-play';
      playBtn.setAttribute('aria-label', 'Spela upp video');
      playBtn.innerHTML = PLAY_SVG;

      playBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (video.paused) {
          canvas.querySelectorAll('video').forEach((v) => { if (v !== video) v.pause(); });
          video.play();
        } else {
          video.pause();
        }
      });
      video.addEventListener('play', () => { playBtn.innerHTML = PAUSE_SVG; });
      video.addEventListener('pause', () => { playBtn.innerHTML = PLAY_SVG; });
      video.addEventListener('ended', () => { playBtn.innerHTML = PLAY_SVG; });

      el.appendChild(video);
      el.appendChild(playBtn);
    } else if (isBox) {
      swatch = document.createElement('button');
      swatch.type = 'button';
      swatch.className = 'mb-box-swatch';
      swatch.setAttribute('aria-label', 'Byt färg');
      applyBoxColor(el, swatch, item.color || BOX_PALETTE[0]);

      swatch.addEventListener('click', (e) => {
        e.stopPropagation();
        const idx = BOX_PALETTE.indexOf(item.color);
        item.color = BOX_PALETTE[(idx + 1 + BOX_PALETTE.length) % BOX_PALETTE.length];
        applyBoxColor(el, swatch, item.color);
        saveColor(item);
      });

      const label = document.createElement('div');
      label.className = 'mb-box-label';
      label.contentEditable = 'true';
      label.setAttribute('data-placeholder', 'Namnge kapitlet …');
      label.textContent = item.content || '';

      label.addEventListener('focus', () => { activeTextItem = item; activeTextEl = label; });
      label.addEventListener('input', () => {
        item.content = label.textContent;
        clearTimeout(textSaveTimer);
        textSaveTimer = setTimeout(() => saveText(item), 700);
      });
      label.addEventListener('blur', () => {
        clearTimeout(textSaveTimer);
        item.content = label.textContent;
        saveText(item);
        if (activeTextEl === label) { activeTextItem = null; activeTextEl = null; }
      });

      el.appendChild(swatch);
      el.appendChild(label);
    } else {
      const img = document.createElement('img');
      img.src = API + 'moodboard-bild?id=' + encodeURIComponent(item.id);
      img.alt = '';
      img.draggable = false;
      el.appendChild(img);
    }

    el.appendChild(del);
    el.appendChild(handle);
    canvas.appendChild(el);

    makeDraggable(el, dragTarget, item);
    makeResizable(handle, el, item);

    del.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!confirm('Ta bort det här från moodboarden?')) return;
      el.remove();
      itemCount--;
      showEmptyState();
      try {
        await fetch(API + 'moodboard-radera', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ id: item.id })
        });
      } catch (err) {
        console.error(err);
      }
    });

    return el;
  }

  function bringToFront(el, item) {
    maxZ += 1;
    item.z = maxZ;
    el.style.zIndex = item.z;
  }

  function saveItem(item) {
    const payload = { id: item.id, x: item.x, y: item.y, w: item.w, z: item.z };
    if (typeof item.h === 'number') payload.h = item.h;
    fetch(API + 'moodboard-uppdatera', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      keepalive: true,
      body: JSON.stringify(payload)
    }).catch((err) => console.error(err));
  }

  function saveColor(item) {
    fetch(API + 'moodboard-uppdatera', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      keepalive: true,
      body: JSON.stringify({ id: item.id, color: item.color })
    }).catch((err) => console.error(err));
  }

  function saveText(item) {
    fetch(API + 'moodboard-uppdatera', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      keepalive: true,
      body: JSON.stringify({ id: item.id, text: item.content })
    }).catch((err) => console.error(err));
  }

  // Håller reda på textrutan som just nu redigeras, plus en
  // debounce-timer, så vi kan tvinga fram en sista sparning om
  // sidan stängs/lämnas mitt i skrivandet.
  let activeTextItem = null;
  let activeTextEl = null;
  let textSaveTimer = null;

  function flushActiveText() {
    if (!activeTextItem || !activeTextEl) return;
    activeTextItem.content = activeTextEl.textContent;
    const payload = JSON.stringify({ id: activeTextItem.id, text: activeTextItem.content });
    if (navigator.sendBeacon) {
      navigator.sendBeacon(API + 'moodboard-uppdatera', new Blob([payload], { type: 'application/json' }));
    } else {
      fetch(API + 'moodboard-uppdatera', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        keepalive: true,
        body: payload
      }).catch((err) => console.error(err));
    }
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') flushActiveText();
  });
  window.addEventListener('pagehide', flushActiveText);

  // ── Dra för att flytta ─────────────────────────────────
  // handleEl: elementet man drar i (hela kortet för bilder,
  // ett smalt handtag längst upp för textkort så man kan
  // klicka i texten utan att börja dra).
  function makeDraggable(el, handleEl, item) {
    let dragging = false;
    let startX, startY, startLeft, startTop;

    handleEl.addEventListener('pointerdown', (e) => {
      if (
        e.target.closest('.mb-resize') ||
        e.target.closest('.mb-delete') ||
        e.target.closest('.mb-play') ||
        e.target.closest('.mb-box-label') ||
        e.target.closest('.mb-box-swatch')
      ) return;
      dragging = true;
      handleEl.setPointerCapture(e.pointerId);
      startX = e.clientX;
      startY = e.clientY;
      startLeft = item.x;
      startTop = item.y;
      bringToFront(el, item);
      el.classList.add('mb-dragging');
    });

    handleEl.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      item.x = startLeft + (e.clientX - startX);
      item.y = startTop + (e.clientY - startY);
      el.style.left = item.x + 'px';
      el.style.top = item.y + 'px';
    });

    function endDrag() {
      if (!dragging) return;
      dragging = false;
      el.classList.remove('mb-dragging');
      saveItem(item);
    }
    handleEl.addEventListener('pointerup', endDrag);
    handleEl.addEventListener('pointercancel', endDrag);
  }

  // ── Dra i hörnet för att ändra storlek ─────────────────
  function makeResizable(handle, el, item) {
    let resizing = false;
    let startX, startY, startW, startH;

    handle.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      resizing = true;
      handle.setPointerCapture(e.pointerId);
      startX = e.clientX;
      startY = e.clientY;
      startW = item.w;
      startH = item.h || 0;
      bringToFront(el, item);
    });

    handle.addEventListener('pointermove', (e) => {
      if (!resizing) return;
      item.w = Math.max(80, Math.min(1400, startW + (e.clientX - startX)));
      el.style.width = item.w + 'px';
      if (item.type === 'box') {
        item.h = Math.max(80, Math.min(1400, startH + (e.clientY - startY)));
        el.style.height = item.h + 'px';
      }
    });

    function endResize() {
      if (!resizing) return;
      resizing = false;
      saveItem(item);
    }
    handle.addEventListener('pointerup', endResize);
    handle.addEventListener('pointercancel', endResize);
  }

  // ── Bildkomprimering innan uppladdning ──────────────────
  function resizeImage(file, maxDim, quality) {
    maxDim = maxDim || 1600;
    quality = quality || 0.85;
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const c = document.createElement('canvas');
        c.width = width;
        c.height = height;
        c.getContext('2d').drawImage(img, 0, 0, width, height);
        URL.revokeObjectURL(url);
        c.toBlob((blob) => {
          if (!blob) { reject(new Error('Kunde inte bearbeta bilden')); return; }
          const reader = new FileReader();
          reader.onload = () => resolve({
            base64: reader.result.split(',')[1],
            contentType: 'image/jpeg',
            width: width
          });
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        }, 'image/jpeg', quality);
      };
      img.onerror = reject;
      img.src = url;
    });
  }

  async function uploadFile(file, pos) {
    const { base64, contentType, width } = await resizeImage(file);
    const w = Math.max(140, Math.min(320, width));
    const res = await fetch(API + 'moodboard-ladda-upp', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ bild: base64, contentType, x: pos.x, y: pos.y, w })
    });
    if (!res.ok) throw new Error('Uppladdningen misslyckades');
    return res.json();
  }

  async function handleFiles(fileList, dropPos) {
    const files = Array.from(fileList).filter((f) => f.type.indexOf('image/') === 0);
    if (files.length === 0) return;
    setStatus('Laddar upp ' + files.length + ' bild' + (files.length > 1 ? 'er' : '') + ' \u2026');
    let offset = 0;
    let failed = 0;
    for (const file of files) {
      const pos = dropPos
        ? { x: Math.max(0, dropPos.x - 100 + offset), y: Math.max(0, dropPos.y - 70 + offset) }
        : { x: 60 + offset, y: 60 + offset };
      offset += 26;
      try {
        const item = await uploadFile(file, pos);
        if (item.z > maxZ) maxZ = item.z;
        renderItem(item);
      } catch (err) {
        console.error(err);
        failed++;
      }
    }
    setStatus(failed ? failed + ' bild(er) kunde inte laddas upp.' : '', !!failed);
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function uploadVideo(file, pos) {
    const base64 = await fileToBase64(file);
    const res = await fetch(API + 'moodboard-ladda-upp', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ bild: base64, contentType: file.type, x: pos.x, y: pos.y, w: 280 })
    });
    if (!res.ok) throw new Error('Uppladdningen misslyckades');
    return res.json();
  }

  async function handleVideoFiles(fileList, dropPos) {
    const all = Array.from(fileList).filter((f) => f.type.indexOf('video/') === 0);
    if (all.length === 0) return;
    const files = all.filter((f) => f.size <= MAX_VIDEO_BYTES);
    const tooBig = all.length - files.length;

    if (files.length === 0) {
      setStatus('Videofilen är för stor (max ' + Math.round(MAX_VIDEO_BYTES / 1024 / 1024) + ' MB). Komprimera klippet och försök igen.', true);
      return;
    }

    setStatus('Laddar upp ' + files.length + ' video' + (files.length > 1 ? 'er' : '') + ' \u2026');
    let offset = 0;
    let failed = 0;
    for (const file of files) {
      const pos = dropPos
        ? { x: Math.max(0, dropPos.x - 100 + offset), y: Math.max(0, dropPos.y - 70 + offset) }
        : { x: 60 + offset, y: 60 + offset };
      offset += 26;
      try {
        const item = await uploadVideo(file, pos);
        if (item.z > maxZ) maxZ = item.z;
        renderItem(item);
      } catch (err) {
        console.error(err);
        failed++;
      }
    }
    if (failed || tooBig) {
      const parts = [];
      if (failed) parts.push(failed + ' video(er) kunde inte laddas upp');
      if (tooBig) parts.push(tooBig + ' video(er) var för stora (max ' + Math.round(MAX_VIDEO_BYTES / 1024 / 1024) + ' MB) och hoppades över');
      setStatus(parts.join('. ') + '.', true);
    } else {
      setStatus('');
    }
  }

  async function createTextItem() {
    try {
      const res = await fetch(API + 'moodboard-text-skapa', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ text: '', x: 80, y: 80, w: 220 })
      });
      if (!res.ok) throw new Error('Kunde inte skapa textrutan');
      const item = await res.json();
      if (item.z > maxZ) maxZ = item.z;
      renderItem(item);
    } catch (err) {
      console.error(err);
      setStatus('Kunde inte skapa textrutan.', true);
    }
  }

  let boxSpawnCount = 0;

  async function createBoxItem() {
    const offset = (boxSpawnCount % 6) * 36;
    boxSpawnCount++;
    const x = 60 + offset;
    const y = 60 + offset;
    try {
      const res = await fetch(API + 'moodboard-box-skapa', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ title: '', x, y, w: 420, h: 320, color: nextBoxColor() })
      });
      if (!res.ok) throw new Error('Kunde inte skapa ramen');
      const item = await res.json();
      if (item.z > maxZ) maxZ = item.z;
      renderItem(item);
    } catch (err) {
      console.error(err);
      setStatus('Kunde inte skapa ramen.', true);
    }
  }

  textBtn.addEventListener('click', createTextItem);
  boxBtn.addEventListener('click', createBoxItem);

  fileInput.addEventListener('change', (e) => {
    handleFiles(e.target.files, null);
    fileInput.value = '';
  });

  videoInput.addEventListener('change', (e) => {
    handleVideoFiles(e.target.files, null);
    videoInput.value = '';
  });

  canvas.addEventListener('dragover', (e) => {
    e.preventDefault();
    canvas.classList.add('mb-dragover');
  });
  canvas.addEventListener('dragleave', (e) => {
    if (e.target === canvas) canvas.classList.remove('mb-dragover');
  });
  canvas.addEventListener('drop', (e) => {
    e.preventDefault();
    canvas.classList.remove('mb-dragover');
    const rect = canvas.getBoundingClientRect();
    const pos = { x: e.clientX - rect.left, y: e.clientY - rect.top };
    handleFiles(e.dataTransfer.files, pos);
    handleVideoFiles(e.dataTransfer.files, pos);
  });

  loadBoard();
})();
</script>
