<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filmgrid</title>
<style>
  :root{--bg:#0e0e10;--panel:#17171a;--line:#2a2a30;--txt:#ececf0;--mut:#9a9aa6;--acc:#e8c547}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
  header{position:sticky;top:0;z-index:20;background:rgba(14,14,16,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 20px}
  .controls{display:flex;flex-wrap:wrap;gap:22px 36px;align-items:flex-end;max-width:1900px;margin:0 auto}
  .ctl{display:flex;flex-direction:column;gap:6px;min-width:240px}
  .ctl label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);display:flex;justify-content:space-between;gap:12px}
  .ctl label b{color:var(--acc);font-weight:600;letter-spacing:0}
  .range{position:relative;height:24px}
  .range .track{position:absolute;left:0;right:0;top:10px;height:4px;background:var(--line);border-radius:2px}
  .range .fill{position:absolute;top:10px;height:4px;background:var(--acc);border-radius:2px}
  .range input{position:absolute;left:0;width:100%;top:0;height:24px;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
  .range input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:18px;height:18px;border-radius:50%;background:var(--acc);border:2px solid var(--bg);cursor:pointer}
  .range input::-moz-range-thumb{pointer-events:auto;width:14px;height:14px;border-radius:50%;background:var(--acc);border:2px solid var(--bg);cursor:pointer}
  .single{position:relative;height:24px}
  .single input{width:100%;margin:0;accent-color:var(--acc)}
  .ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--mut)}
  .ticks span{cursor:pointer}.ticks span.on{color:var(--acc)}
  select,input[type=search]{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font:inherit}
  .count{margin-left:auto;color:var(--mut);font-size:13px;align-self:center}
  #reset{background:none;border:1px solid var(--line);color:var(--mut);border-radius:6px;padding:7px 12px;cursor:pointer;font:inherit}
  #reset:hover{color:var(--txt);border-color:var(--mut)}
  main{padding:16px 20px 60px;max-width:1900px;margin:0 auto}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
  .card{position:relative;aspect-ratio:16/9;background:var(--panel);border-radius:6px;overflow:hidden;cursor:pointer}
  .card[hidden]{display:none}
  .card img,.card video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .card .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 8px;background:linear-gradient(transparent,rgba(0,0,0,.85));opacity:0;transition:opacity .15s;pointer-events:none}
  .card:hover .cap,.card:focus-visible .cap{opacity:1}
  .cap .t{font-weight:600;font-size:13px}.cap .m{font-size:11px;color:#cfcfd6}
  .card .star{position:absolute;top:6px;right:8px;color:var(--acc);font-size:14px;text-shadow:0 1px 3px #000}
  .card.fallback{display:flex;align-items:center;justify-content:center;padding:10px;text-align:center;color:var(--mut)}
  .empty{padding:80px 0;text-align:center;color:var(--mut)}
  #lb{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px}
  #lb.open{display:flex}
  #lb video{max-width:min(1400px,94vw);max-height:72vh;background:#000;border-radius:4px}
  #lb .info{max-width:900px;width:100%;margin-top:14px}
  #lb h2{margin:0 0 4px;font-size:20px}
  #lb .meta{color:var(--acc);font-size:13px;margin-bottom:8px}
  #lb .det{color:var(--mut);white-space:pre-line;font-size:14px}
  #lb button{position:absolute;background:none;border:0;color:#fff;font-size:34px;cursor:pointer;padding:12px;opacity:.7}
  #lb button:hover{opacity:1}
  #lb .x{top:8px;right:14px}#lb .prev{left:8px;top:45%}#lb .next{right:8px;top:45%}
</style>
</head>
<body>
<header>
  <div class="controls">
    <div class="ctl" style="min-width:300px">
      <label>Årtal <b id="yLabel"></b></label>
      <div class="range">
        <div class="track"></div><div class="fill" id="yFill"></div>
        <input type="range" id="yMin"><input type="range" id="yMax">
      </div>
    </div>
    <div class="ctl" style="min-width:360px">
      <label>Kategori <b id="cLabel">Alla</b></label>
      <div class="single"><input type="range" id="cat" min="0" step="1"></div>
      <div class="ticks" id="cTicks"></div>
    </div>
    <div class="ctl" style="min-width:160px">
      <label>Sortera</label>
      <select id="sort">
        <option value="yd">År, nyast först</option>
        <option value="ya">År, äldst först</option>
        <option value="t">Titel A–Ö</option>
        <option value="o">Ursprunglig ordning</option>
      </select>
    </div>
    <div class="ctl" style="min-width:160px">
      <label>Sök</label>
      <input type="search" id="q" placeholder="Titel eller text…">
    </div>
    <button id="reset">Nollställ</button>
    <div class="count" id="count"></div>
  </div>
</header>
<main>
  <div id="grid"></div>
  <div class="empty" id="empty" hidden>Inga filmer matchar filtret.</div>
</main>
<div id="lb">
  <button class="x" aria-label="Stäng">×</button>
  <button class="prev" aria-label="Föregående">‹</button>
  <button class="next" aria-label="Nästa">›</button>
  <video id="lbv" controls playsinline></video>
  <div class="info"><h2 id="lbt"></h2><div class="meta" id="lbm"></div><div class="det" id="lbd"></div></div>
</div>

const CATS = ['Alla','Commercials','TV','Film','Animated','VR','Hero'];
const $ = id => document.getElementById(id);
const years = DATA.map(d=>d.y).filter(Boolean);
const Y0 = Math.min(...years), Y1 = Math.max(...years);

// ---------- setup ----------
const yMin=$('yMin'), yMax=$('yMax'), cat=$('cat');
[yMin,yMax].forEach(e=>{e.min=Y0;e.max=Y1;e.step=1});
yMin.value=Y0; yMax.value=Y1;
cat.max=CATS.length-1; cat.value=0;
$('cTicks').innerHTML = CATS.map((c,i)=>`<span data-i="${i}">${c}</span>`).join('');
$('cTicks').addEventListener('click',e=>{if(e.target.dataset.i){cat.value=e.target.dataset.i;apply()}});

const grid=$('grid');
const cards = DATA.map((d,i)=>{
  const el=document.createElement('div');
  el.className='card'; el.tabIndex=0; el.dataset.i=i;
  if(d.p){
    const im=document.createElement('img'); im.loading='lazy'; im.decoding='async'; im.alt=d.t; im.src=d.p;
    im.onerror=()=>{im.remove();el.classList.add('fallback');el.prepend(d.t)};
    el.appendChild(im);
  } else {
    const v=document.createElement('video'); v.muted=true; v.preload='metadata'; v.src=d.v+'#t=1'; el.appendChild(v);
  }
  if(d.h){const s=document.createElement('span');s.className='star';s.textContent='★';el.appendChild(s)}
  const cap=document.createElement('div'); cap.className='cap';
  cap.innerHTML=`<div class="t"></div><div class="m"></div>`;
  cap.firstChild.textContent=d.t;
  cap.lastChild.textContent=[d.y||'', d.c.join(' · ')].filter(Boolean).join(' · ');
  el.appendChild(cap);
  grid.appendChild(el);
  return el;
});

// ---------- hover-förhandsvisning ----------
let hv=null;
function stopPreview(){ if(hv){hv.remove();hv=null} }
grid.addEventListener('mouseover',e=>{
  const c=e.target.closest('.card'); if(!c||c.querySelector('.pv')||!matchMedia('(hover:hover)').matches) return;
  stopPreview();
  const v=document.createElement('video');
  v.className='pv'; v.muted=true; v.loop=true; v.playsInline=true; v.src=DATA[c.dataset.i].v;
  c.insertBefore(v,c.querySelector('.cap')); hv=v; v.play().catch(()=>{});
});
grid.addEventListener('mouseout',e=>{
  const c=e.target.closest('.card'); if(c&&!c.contains(e.relatedTarget)) stopPreview();
});

// ---------- filter/sortering ----------
const collator=new Intl.Collator('sv');
function apply(){
  let a=+yMin.value, b=+yMax.value;
  if(a>b){ if(document.activeElement===yMin){a=b;yMin.value=a}else{b=a;yMax.value=b} }
  const full = a===Y0 && b===Y1;
  const ci=+cat.value, cname=CATS[ci], q=$('q').value.trim().toLowerCase();
  $('yLabel').textContent = a===b ? a : `${a} – ${b}`;
  $('cLabel').textContent = cname;
  document.querySelectorAll('#cTicks span').forEach((s,i)=>s.classList.toggle('on',i===ci));
  const pct=v=>(v-Y0)/(Y1-Y0)*100;
  $('yFill').style.left=pct(a)+'%'; $('yFill').style.right=(100-pct(b))+'%';

  let shown=0;
  DATA.forEach((d,i)=>{
    let ok = d.y ? (d.y>=a && d.y<=b) : full;
    if(ok && ci>0) ok = cname==='Hero' ? d.h : d.c.includes(cname);
    if(ok && q) ok = (d.t+' '+d.d).toLowerCase().includes(q);
    cards[i].hidden=!ok; if(ok) shown++;
  });
  // sortera
  const s=$('sort').value;
  const idx=DATA.map((_,i)=>i).sort((i,j)=>{
    const A=DATA[i],B=DATA[j];
    if(s==='yd') return (B.y||0)-(A.y||0) || A.o-B.o;
    if(s==='ya') return (A.y||9999)-(B.y||9999) || A.o-B.o;
    if(s==='t') return collator.compare(A.t,B.t);
    return A.o-B.o;
  });
  idx.forEach(i=>grid.appendChild(cards[i]));
  $('count').textContent=`Visar ${shown} av ${DATA.length}`;
  $('empty').hidden=shown>0;
}
[yMin,yMax,cat].forEach(e=>e.addEventListener('input',apply));
$('sort').addEventListener('change',apply);
$('q').addEventListener('input',apply);
$('reset').onclick=()=>{yMin.value=Y0;yMax.value=Y1;cat.value=0;$('q').value='';apply()};

// ---------- lightbox ----------
const lb=$('lb'), lbv=$('lbv'); let cur=-1;
function visible(){return [...grid.children].filter(c=>!c.hidden).map(c=>+c.dataset.i)}
function open(i){
  stopPreview(); cur=i; const d=DATA[i];
  lbv.src=d.v; lbv.play().catch(()=>{});
  $('lbt').textContent=d.t;
  $('lbm').textContent=[d.y||'', d.c.join(' · '), d.h?'★ Hero':''].filter(Boolean).join('  ·  ');
  $('lbd').textContent=d.d;
  lb.classList.add('open'); document.body.style.overflow='hidden';
}
function close(){lbv.pause();lbv.removeAttribute('src');lbv.load();lb.classList.remove('open');document.body.style.overflow=''}
function step(n){const v=visible(); if(!v.length) return; open(v[(v.indexOf(cur)+n+v.length)%v.length])}
grid.addEventListener('click',e=>{const c=e.target.closest('.card'); if(c) open(+c.dataset.i)});
grid.addEventListener('keydown',e=>{if(e.key==='Enter'){const c=e.target.closest('.card'); if(c) open(+c.dataset.i)}});
lb.querySelector('.x').onclick=close;
lb.querySelector('.prev').onclick=()=>step(-1);
lb.querySelector('.next').onclick=()=>step(1);
lb.addEventListener('click',e=>{if(e.target===lb)close()});
document.addEventListener('keydown',e=>{
  if(!lb.classList.contains('open')) return;
  if(e.key==='Escape')close(); if(e.key==='ArrowLeft')step(-1); if(e.key==='ArrowRight')step(1);
});

apply();
</script>
