<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Singoalla — Skärgårdskryssaren 1918–1922</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>

<style>
  :root{
    --ink-black:   #0b0e12;
    --deep-navy:   #10202f;
    --brass:       #b28a4c;
    --brass-dim:   #6f5a37;
    --fog:         #aab3bd;
    --fog-dim:     #5c6570;
    --paper-edge:  #dfd7c2;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; height:100%;
    background:
      radial-gradient(ellipse at 50% -10%, #182a3a 0%, var(--ink-black) 55%),
      var(--ink-black);
    color:var(--fog);
    font-family:'Jost', sans-serif;
    overflow:hidden;
  }

  /* faint compass-rose watermark, signature element */
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image: radial-gradient(circle at 50% 50%, transparent 0 38%, rgba(178,138,76,0.05) 38.3% 38.6%, transparent 38.9%),
                       radial-gradient(circle at 50% 50%, transparent 0 46%, rgba(178,138,76,0.04) 46.3% 46.5%, transparent 46.8%);
    background-size: min(70vw,70vh) min(70vw,70vh);
    background-repeat:no-repeat;
    background-position:center;
    pointer-events:none;
    z-index:0;
  }

  .stage{
    position:relative;
    height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    padding: clamp(10px,2.5vh,28px) clamp(10px,3vw,40px);
    z-index:1;
  }

  header{
    text-align:center;
    flex:0 0 auto;
    width:100%;
  }
  header a.home{
    position:absolute;
    left:clamp(10px,3vw,40px);
    top:clamp(10px,2.5vh,28px);
    color:var(--fog-dim);
    text-decoration:none;
    font-size:0.78rem;
    letter-spacing:.04em;
    border-bottom:1px solid transparent;
    transition:color .2s, border-color .2s;
  }
  header a.home:hover{ color:var(--brass); border-color:var(--brass-dim); }

  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:clamp(1.6rem, 4vw, 2.6rem);
    letter-spacing:.03em;
    color:#eae4d6;
    margin:0 0 2px;
  }
  .subtitle{
    font-size:0.72rem;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--brass);
    margin:0;
  }

  .book-wrap{
    --gap-y: clamp(20px,4vh,56px);
    --gap-x: clamp(30px,6vw,80px);
    flex:1 1 auto;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:0;
    position:relative;
  }

  .book-frame{
    position:absolute;
    top: var(--gap-y);
    bottom: var(--gap-y);
    left: var(--gap-x);
    right: var(--gap-x);
    overflow:hidden;
    touch-action:none;
  }

  #zoomLayer{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    transform-origin:center center;
    will-change:transform;
    user-select:none;
  }
  #zoomLayer.zoomed{ cursor:grab; }
  #zoomLayer.zoomed.dragging{ cursor:grabbing; }

  #book{
    box-shadow: 0 30px 70px -20px rgba(0,0,0,0.75);
  }

  .nav-btn{
    position:absolute;
    top:50%; transform:translateY(-50%);
    width:clamp(34px,4vw,52px);
    height:clamp(34px,4vw,52px);
    border-radius:50%;
    border:1px solid rgba(178,138,76,0.35);
    background:rgba(16,32,47,0.55);
    backdrop-filter:blur(3px);
    color:var(--brass);
    font-size:1.2rem;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:background .2s, border-color .2s, transform .2s;
    user-select:none;
    z-index:2;
  }
  .nav-btn:hover{ background:rgba(178,138,76,0.18); border-color:var(--brass); }
  .nav-btn:active{ transform:translateY(-50%) scale(0.92); }
  .nav-btn.prev{ left:0; }
  .nav-btn.next{ right:0; }
  .nav-btn.disabled{ opacity:0.25; pointer-events:none; }

  footer{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    gap:18px;
    padding-top:clamp(8px,1.6vh,16px);
  }

  .page-indicator{
    font-size:0.8rem;
    letter-spacing:.08em;
    color:var(--fog-dim);
    min-width:80px;
    text-align:center;
    font-variant-numeric: tabular-nums;
  }
  .page-indicator b{ color:var(--fog); font-weight:500; }

  .slider{
    -webkit-appearance:none;
    appearance:none;
    width:clamp(140px,22vw,320px);
    height:2px;
    background:linear-gradient(to right, var(--brass) 0%, var(--brass) var(--pct,0%), rgba(255,255,255,0.15) var(--pct,0%));
    border-radius:2px;
    outline:none;
    cursor:pointer;
  }
  .slider::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:12px;height:12px;border-radius:50%;
    background:var(--brass);
    border:2px solid var(--ink-black);
    box-shadow:0 0 0 1px var(--brass);
    margin-top:-5px;
  }
  .slider::-moz-range-thumb{
    width:10px;height:10px;border-radius:50%;
    background:var(--brass); border:2px solid var(--ink-black);
  }
  .slider::-moz-range-track{ height:2px; background:rgba(255,255,255,0.15); border-radius:2px; }

  .icon-btn{
    background:none;
    border:1px solid rgba(178,138,76,0.3);
    color:var(--fog-dim);
    width:32px; height:32px;
    border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    font-size:0.85rem;
    transition:color .2s, border-color .2s;
  }
  .icon-btn:hover{ color:var(--brass); border-color:var(--brass); }
  .icon-btn.disabled{ opacity:0.3; pointer-events:none; }

  .zoom-level{
    font-size:0.7rem;
    color:var(--fog-dim);
    min-width:38px;
    text-align:center;
    font-variant-numeric: tabular-nums;
  }

  /* hint on first load */
  .hint{
    position:absolute;
    bottom: clamp(70px,12vh,110px);
    left:50%; transform:translateX(-50%);
    font-size:0.7rem;
    letter-spacing:.1em;
    color:var(--fog-dim);
    text-transform:uppercase;
    opacity:0.85;
    animation: fade-hint 4.5s ease forwards;
    pointer-events:none;
    z-index:2;
    white-space:nowrap;
  }
  @keyframes fade-hint{
    0%{opacity:0;} 12%{opacity:0.85;} 78%{opacity:0.85;} 100%{opacity:0;}
  }

  @media (max-width: 640px){
    .nav-btn{ display:none; }
    .book-wrap{ --gap-y: clamp(14px,3vh,28px); --gap-x: 0px; }
    footer{ gap:10px; }
    .slider{ width: 40vw; }
  }
</style>
</head>
<body>

<div class="stage">
  <header>
    <a class="home" href="../index.html">&larr; harryjohans.se</a>
    <h1>Singoalla</h1>
    <p class="subtitle">150 kvm skärgårdskryssare · 1918–1922</p>
  </header>

  <div class="book-wrap">
    <div class="nav-btn prev" id="prevBtn" aria-label="Föregående sida">&#10094;</div>
    <div class="book-frame">
      <div id="zoomLayer">
        <div id="book"></div>
      </div>
    </div>
    <div class="nav-btn next" id="nextBtn" aria-label="Nästa sida">&#10095;</div>
    <div class="hint" id="hint">Klicka eller svep för att bläddra</div>
  </div>

  <footer>
    <button class="icon-btn" id="fsBtn" title="Helskärm">&#9974;</button>
    <button class="icon-btn" id="zoomOutBtn" title="Zooma ut">&#8722;</button>
    <span class="zoom-level" id="zoomLevel">100%</span>
    <button class="icon-btn" id="zoomInBtn" title="Zooma in">&#43;</button>
    <div class="page-indicator"><b id="curPage">1</b> / <span id="totalPages">18</span></div>
    <input type="range" class="slider" id="slider" min="1" max="18" value="1">
  </footer>
</div>

<script>
  const TOTAL_PAGES = 18;
  const pages = [];
  for(let i=1;i<=TOTAL_PAGES;i++){
    pages.push('images/page-' + String(i).padStart(2,'0') + '.jpg');
  }

  const bookEl = document.getElementById('book');

  const pageFlip = new St.PageFlip(bookEl, {
    width: 620,
    height: 876,
    size: "stretch",
    minWidth: 260,
    maxWidth: 1100,
    minHeight: 370,
    maxHeight: 1300,
    showCover: true,
    usePortrait: true,
    maxShadowOpacity: 0.55,
    mobileScrollSupport: false,
    flippingTime: 700,
    swipeDistance: 20
  });

  pageFlip.loadFromImages(pages);

  // The frame's real size can shift slightly once the web font finishes
  // loading (it reflows the header/footer). PageFlip only re-measures on
  // a real 'resize' event, so nudge it after layout settles to avoid the
  // book being clipped by book-frame's overflow:hidden.
  function nudgeResize(){ window.dispatchEvent(new Event('resize')); }
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(() => setTimeout(nudgeResize, 50));
  }
  window.addEventListener('load', () => setTimeout(nudgeResize, 50));
  window.addEventListener('orientationchange', () => setTimeout(nudgeResize, 150));
  setTimeout(nudgeResize, 400); // safety net for slow connections

  const curPageEl = document.getElementById('curPage');
  const totalPagesEl = document.getElementById('totalPages');
  const sliderEl = document.getElementById('slider');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  totalPagesEl.textContent = TOTAL_PAGES;
  sliderEl.max = TOTAL_PAGES;

  function updateUI(pageIndex){
    const shown = pageIndex + 1;
    curPageEl.textContent = shown;
    sliderEl.value = shown;
    const pct = ((shown-1)/(TOTAL_PAGES-1))*100;
    sliderEl.style.setProperty('--pct', pct + '%');
    prevBtn.classList.toggle('disabled', pageIndex <= 0);
    nextBtn.classList.toggle('disabled', pageIndex >= TOTAL_PAGES-1);
  }

  pageFlip.on('flip', (e) => updateUI(e.data));
  pageFlip.on('init', () => updateUI(0));

  prevBtn.addEventListener('click', () => pageFlip.flipPrev());
  nextBtn.addEventListener('click', () => pageFlip.flipNext());

  sliderEl.addEventListener('input', () => {
    pageFlip.flip(parseInt(sliderEl.value,10) - 1);
  });

  document.addEventListener('keydown', (e) => {
    if(e.key === 'ArrowRight') pageFlip.flipNext();
    if(e.key === 'ArrowLeft') pageFlip.flipPrev();
  });

  const fsBtn = document.getElementById('fsBtn');
  fsBtn.addEventListener('click', () => {
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen().catch(()=>{});
    } else {
      document.exitFullscreen();
    }
  });

  // remove hint on first interaction
  const hint = document.getElementById('hint');
  bookEl.addEventListener('click', () => hint.remove(), {once:true});

  // ── Zoom & pan ──────────────────────────────────────────
  const bookFrame = document.querySelector('.book-frame');
  const zoomLayer = document.getElementById('zoomLayer');
  const zoomLevelEl = document.getElementById('zoomLevel');
  const zoomInBtn = document.getElementById('zoomInBtn');
  const zoomOutBtn = document.getElementById('zoomOutBtn');

  const MIN_SCALE = 1;
  const MAX_SCALE = 3.5;
  let scale = 1, tx = 0, ty = 0;

  function clampPan(s, x, y){
    // don't let the image be dragged entirely out of view
    const rect = bookFrame.getBoundingClientRect();
    const maxX = (rect.width * (s - 1)) / 2 + rect.width * 0.15;
    const maxY = (rect.height * (s - 1)) / 2 + rect.height * 0.15;
    return [Math.max(-maxX, Math.min(maxX, x)), Math.max(-maxY, Math.min(maxY, y))];
  }

  function applyTransform(){
    zoomLayer.style.transform = `scale(${scale}) translate(${tx/scale}px, ${ty/scale}px)`;
    zoomLayer.classList.toggle('zoomed', scale > 1.001);
    zoomLevelEl.textContent = Math.round(scale * 100) + '%';
    zoomOutBtn.classList.toggle('disabled', scale <= MIN_SCALE + 0.001);
    zoomInBtn.classList.toggle('disabled', scale >= MAX_SCALE - 0.001);
  }

  function setZoom(newScale, anchorX, anchorY){
    newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));
    const rect = bookFrame.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const ax = (anchorX ?? cx) - cx;
    const ay = (anchorY ?? cy) - cy;
    // content-space point currently under the anchor, then re-solve translate
    // so that same point stays under the anchor at the new scale.
    const px = (ax - tx) / scale;
    const py = (ay - ty) / scale;
    let newTx = ax - newScale * px;
    let newTy = ay - newScale * py;
    if(newScale <= MIN_SCALE + 0.001){ newTx = 0; newTy = 0; }
    [newTx, newTy] = clampPan(newScale, newTx, newTy);
    scale = newScale; tx = newTx; ty = newTy;
    applyTransform();
  }

  function resetZoom(){ scale = 1; tx = 0; ty = 0; applyTransform(); }

  zoomInBtn.addEventListener('click', () => setZoom(scale * 1.6));
  zoomOutBtn.addEventListener('click', () => setZoom(scale / 1.6));

  // reset zoom whenever a page turn happens
  pageFlip.on('flip', () => resetZoom());

  // double-click / double-tap toggles zoom at that point
  let lastTap = 0;
  bookFrame.addEventListener('dblclick', (e) => {
    e.preventDefault();
    if(scale > 1.01) resetZoom();
    else setZoom(2.4, e.clientX, e.clientY);
  });

  // desktop: wheel to zoom (also covers trackpad pinch, reported as ctrl+wheel)
  bookFrame.addEventListener('wheel', (e) => {
    e.preventDefault();
    const factor = Math.exp(-e.deltaY * 0.0018);
    setZoom(scale * factor, e.clientX, e.clientY);
  }, { passive:false });

  // touch: pinch to zoom, one-finger drag to pan (only while zoomed)
  let pinchStartDist = 0, pinchStartScale = 1;
  let dragging = false, dragStartX = 0, dragStartY = 0, dragStartTx = 0, dragStartTy = 0;

  function touchDist(t0, t1){
    return Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
  }
  function touchMid(t0, t1){
    return { x: (t0.clientX + t1.clientX) / 2, y: (t0.clientY + t1.clientY) / 2 };
  }

  bookFrame.addEventListener('touchstart', (e) => {
    if(e.touches.length === 2){
      pinchStartDist = touchDist(e.touches[0], e.touches[1]);
      pinchStartScale = scale;
      dragging = false;
    } else if(e.touches.length === 1 && scale > 1.01){
      dragging = true;
      zoomLayer.classList.add('dragging');
      dragStartX = e.touches[0].clientX;
      dragStartY = e.touches[0].clientY;
      dragStartTx = tx; dragStartTy = ty;
    }
  }, { passive:true });

  bookFrame.addEventListener('touchmove', (e) => {
    if(e.touches.length === 2){
      e.preventDefault();
      const dist = touchDist(e.touches[0], e.touches[1]);
      const mid = touchMid(e.touches[0], e.touches[1]);
      const ratio = dist / (pinchStartDist || dist);
      setZoom(pinchStartScale * ratio, mid.x, mid.y);
    } else if(dragging && e.touches.length === 1){
      e.preventDefault();
      const dx = e.touches[0].clientX - dragStartX;
      const dy = e.touches[0].clientY - dragStartY;
      const [nx, ny] = clampPan(scale, dragStartTx + dx, dragStartTy + dy);
      tx = nx; ty = ny;
      applyTransform();
    }
  }, { passive:false });

  bookFrame.addEventListener('touchend', () => {
    dragging = false;
    zoomLayer.classList.remove('dragging');
  });

  // desktop: click-drag to pan while zoomed (mouse)
  let mouseDown = false;
  zoomLayer.addEventListener('mousedown', (e) => {
    if(scale <= 1.01) return;
    mouseDown = true;
    zoomLayer.classList.add('dragging');
    dragStartX = e.clientX; dragStartY = e.clientY;
    dragStartTx = tx; dragStartTy = ty;
    e.preventDefault();
  });
  window.addEventListener('mousemove', (e) => {
    if(!mouseDown) return;
    const dx = e.clientX - dragStartX;
    const dy = e.clientY - dragStartY;
    const [nx, ny] = clampPan(scale, dragStartTx + dx, dragStartTy + dy);
    tx = nx; ty = ny;
    applyTransform();
  });
  window.addEventListener('mouseup', () => {
    mouseDown = false;
    zoomLayer.classList.remove('dragging');
  });

  // keyboard shortcuts: +/- to zoom, 0 to reset
  document.addEventListener('keydown', (e) => {
    if(e.key === '+' || e.key === '=') setZoom(scale * 1.3);
    if(e.key === '-' || e.key === '_') setZoom(scale / 1.3);
    if(e.key === '0') resetZoom();
  });

  applyTransform();
</script>

</body>
</html>
