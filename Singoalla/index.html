<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Singoalla — Skärgårdskryssaren 1918–1922</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>

<style>
  :root{
    --ink-black:   #0b0e12;
    --deep-navy:   #10202f;
    --brass:       #b28a4c;
    --brass-dim:   #6f5a37;
    --fog:         #aab3bd;
    --fog-dim:     #5c6570;
    --paper-edge:  #dfd7c2;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; height:100%;
    background:
      radial-gradient(ellipse at 50% -10%, #182a3a 0%, var(--ink-black) 55%),
      var(--ink-black);
    color:var(--fog);
    font-family:'Jost', sans-serif;
    overflow:hidden;
    touch-action:none;
    overscroll-behavior:none;
    -webkit-user-select:none;
    user-select:none;
  }

  /* faint compass-rose watermark, signature element */
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image: radial-gradient(circle at 50% 50%, transparent 0 38%, rgba(178,138,76,0.05) 38.3% 38.6%, transparent 38.9%),
                       radial-gradient(circle at 50% 50%, transparent 0 46%, rgba(178,138,76,0.04) 46.3% 46.5%, transparent 46.8%);
    background-size: min(70vw,70vh) min(70vw,70vh);
    background-repeat:no-repeat;
    background-position:center;
    pointer-events:none;
    z-index:0;
  }

  .stage{
    position:relative;
    height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    padding: clamp(10px,2.5vh,28px) clamp(10px,3vw,40px);
    z-index:1;
  }

  .book-wrap{
    --gap-y: clamp(20px,4vh,56px);
    --gap-x: clamp(30px,6vw,80px);
    flex:1 1 auto;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:0;
    position:relative;
  }

  .book-frame{
    position:absolute;
    top: var(--gap-y);
    bottom: var(--gap-y);
    left: var(--gap-x);
    right: var(--gap-x);
    touch-action:none;
  }

  #zoomLayer{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    transform-origin:center center;
    will-change:transform;
    user-select:none;
  }
  #zoomLayer.zoomed{ cursor:grab; }
  #zoomLayer.zoomed.dragging{ cursor:grabbing; }

  #book{
    box-shadow: 0 30px 70px -20px rgba(0,0,0,0.75);
  }

  .side-nav{
    touch-action:manipulation;
    position:absolute;
    top:50%; transform:translateY(-50%);
    width:clamp(34px,3.2vw,48px);
    height:clamp(34px,3.2vw,48px);
    border-radius:50%;
    border:1px solid rgba(178,138,76,0.35);
    background:rgba(16,32,47,0.55);
    backdrop-filter:blur(3px);
    color:var(--brass);
    font-size:1.15rem;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:background .2s, border-color .2s, transform .2s;
    user-select:none;
    z-index:2;
  }
  .side-nav:hover{ background:rgba(178,138,76,0.18); border-color:var(--brass); }
  .side-nav:active{ transform:translateY(-50%) scale(0.92); }
  .side-nav.prev{ left:0; }
  .side-nav.next{ right:0; }
  .side-nav.disabled{ opacity:0.25; pointer-events:none; }
  /* only shown once there's real room beside the book to hold them without
     crowding the page content */
  @media (max-width: 900px){
    .side-nav{ display:none; }
  }
  @media (min-width: 901px){
    #prevBtn, #nextBtn{ display:none; }
  }

  footer{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    gap:18px;
    padding-top:clamp(8px,1.6vh,16px);
    touch-action:manipulation;
  }

  .page-indicator{
    font-size:0.8rem;
    letter-spacing:.08em;
    color:var(--fog-dim);
    min-width:80px;
    text-align:center;
    font-variant-numeric: tabular-nums;
  }
  .page-indicator b{ color:var(--fog); font-weight:500; }

  .slider{
    -webkit-appearance:none;
    appearance:none;
    width:clamp(140px,22vw,320px);
    height:2px;
    background:linear-gradient(to right, var(--brass) 0%, var(--brass) var(--pct,0%), rgba(255,255,255,0.15) var(--pct,0%));
    border-radius:2px;
    outline:none;
    cursor:pointer;
  }
  .slider::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:12px;height:12px;border-radius:50%;
    background:var(--brass);
    border:2px solid var(--ink-black);
    box-shadow:0 0 0 1px var(--brass);
    margin-top:-5px;
  }
  .slider::-moz-range-thumb{
    width:10px;height:10px;border-radius:50%;
    background:var(--brass); border:2px solid var(--ink-black);
  }
  .slider::-moz-range-track{ height:2px; background:rgba(255,255,255,0.15); border-radius:2px; }

  .icon-btn{
    background:none;
    border:1px solid rgba(178,138,76,0.3);
    color:var(--fog-dim);
    width:32px; height:32px;
    border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    font-size:0.85rem;
    transition:color .2s, border-color .2s;
  }
  .icon-btn:hover{ color:var(--brass); border-color:var(--brass); }
  .icon-btn.disabled{ opacity:0.3; pointer-events:none; }

  .zoom-level{
    font-size:0.7rem;
    color:var(--fog-dim);
    min-width:38px;
    text-align:center;
    font-variant-numeric: tabular-nums;
  }

  /* hint on first load */
  .hint{
    position:absolute;
    bottom: clamp(70px,12vh,110px);
    left:50%; transform:translateX(-50%);
    font-size:0.7rem;
    letter-spacing:.1em;
    color:var(--fog-dim);
    text-transform:uppercase;
    opacity:0.85;
    animation: fade-hint 4.5s ease forwards;
    pointer-events:none;
    z-index:2;
    white-space:nowrap;
  }
  @keyframes fade-hint{
    0%{opacity:0;} 12%{opacity:0.85;} 78%{opacity:0.85;} 100%{opacity:0;}
  }

  .tip{
    position:absolute;
    bottom: clamp(70px,12vh,110px);
    left:50%; transform:translateX(-50%);
    max-width:min(88vw, 380px);
    text-align:center;
    background:rgba(16,32,47,0.92);
    border:1px solid rgba(178,138,76,0.4);
    color:var(--fog);
    font-size:0.78rem;
    line-height:1.4;
    padding:10px 16px;
    border-radius:8px;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
    z-index:3;
  }
  .tip.show{ opacity:1; }

  @media (max-width: 640px){
    .book-wrap{ --gap-y: clamp(14px,3vh,28px); --gap-x: 0px; }
    footer{ gap:10px; }
    .slider{ width: 40vw; }
  }
</style>
</head>
<body>

<div class="stage">

  <div class="book-wrap">
    <div class="side-nav prev" id="prevBtnSide" aria-label="Föregående sida">&#10094;</div>
    <div class="book-frame">
      <div id="zoomLayer"></div>
    </div>
    <div class="side-nav next" id="nextBtnSide" aria-label="Nästa sida">&#10095;</div>
    <div class="hint" id="hint">Svep eller använd pilarna · nyp/scrolla för att zooma</div>
  </div>

  <footer>
    <button class="icon-btn" id="fsBtn" title="Helskärm">&#9974;</button>
    <button class="icon-btn" id="zoomOutBtn" title="Zooma ut">&#8722;</button>
    <span class="zoom-level" id="zoomLevel">100%</span>
    <button class="icon-btn" id="zoomInBtn" title="Zooma in">&#43;</button>
    <button class="icon-btn" id="prevBtn" title="Föregående sida">&#10094;</button>
    <div class="page-indicator"><b id="curPage">1</b> / <span id="totalPages">18</span></div>
    <button class="icon-btn" id="nextBtn" title="Nästa sida">&#10095;</button>
    <input type="range" class="slider" id="slider" min="1" max="18" value="1">
  </footer>
</div>

<script>
  const TOTAL_PAGES = 18;
  const pages = [];
  for(let i=1;i<=TOTAL_PAGES;i++){
    pages.push('images/page-' + String(i).padStart(2,'0') + '.jpg');
  }

  const bookFrame = document.querySelector('.book-frame');
  const zoomLayer = document.getElementById('zoomLayer');
  const PAGE_RATIO = 620 / 876; // single-page width/height, matches our scanned pages

  let pageFlip = null;
  let currentBookEl = null;

  // StPageFlip's "stretch" mode derives the book's HEIGHT purely from its
  // WIDTH (height = width / ratio) — it never looks at how much vertical
  // space is actually available. So instead of trusting it to fit our
  // frame, we work out the right width ourselves (from the frame's real
  // height) and pass that in as a hard maxWidth. Because that number can
  // only be set at construction time, we rebuild the book whenever the
  // frame's size changes.
  function computeSize(){
    const rect = bookFrame.getBoundingClientRect();
    const availW = Math.max(rect.width, 100);
    const availH = Math.max(rect.height, 100);
    const isPortraitMode = window.innerWidth < 640; // matches our own CSS breakpoint
    const shapeRatio = isPortraitMode ? PAGE_RATIO : (2 * PAGE_RATIO); // single vs. two-page spread
    const widthFromHeight = availH * shapeRatio;
    const totalW = Math.max(240, Math.min(availW, widthFromHeight));
    const perPage = isPortraitMode ? totalW : totalW / 2;
    return {
      width: Math.round(perPage),
      height: Math.round(perPage / PAGE_RATIO),
      isPortraitMode
    };
  }

  function buildBook(startPage){
    zoomLayer.innerHTML = '';
    const bookEl = document.createElement('div');
    bookEl.id = 'book';
    zoomLayer.appendChild(bookEl);

    const size = computeSize();
    // PageFlip decides single-page vs. two-page-spread itself, based on
    // comparing its rendered width against 2*minWidth — so minWidth has to
    // be pinned to what WE already decided (via isPortraitMode), or the two
    // can disagree on some screen sizes. In portrait mode, setting minWidth
    // to the full page width guarantees width < 2*minWidth (single page);
    // in landscape mode, a low minWidth keeps it comfortably above that
    // threshold (two-page spread).
    const minWidth = size.isPortraitMode ? size.width : Math.min(180, size.width);

    pageFlip = new St.PageFlip(bookEl, {
      width: size.width,
      height: size.height,
      size: "stretch",
      minWidth: minWidth,
      maxWidth: size.width,
      minHeight: Math.min(240, size.height),
      maxHeight: size.height,
      showCover: true,
      usePortrait: true,
      maxShadowOpacity: 0.55,
      mobileScrollSupport: false,
      flippingTime: 700,
      swipeDistance: 20,
      useMouseEvents: false,
      startPage: startPage || 0
    });

    pageFlip.loadFromImages(pages);
    currentBookEl = bookEl;
    pageFlip.on('flip', (e) => { updateUI(e.data); resetZoom(); });
    pageFlip.on('init', () => {
      updateUI(pageFlip.getCurrentPageIndex());
      sharpenCanvas(bookEl, 1);
    });
  }

  // StPageFlip sizes its internal <canvas> backing store to match its CSS
  // size 1:1, then the browser stretches that to fill the same box on
  // screen. On a Retina/HiDPI display (devicePixelRatio > 1) that means
  // it's always rendered at half (or less) of the screen's real
  // resolution and then blown up — soft text regardless of how sharp the
  // source images are. This re-sizes the actual pixel buffer to match the
  // screen and scales the drawing context to compensate, so the library's
  // existing draw calls (which work in CSS-like page units) land at full
  // device resolution.
  function sharpenCanvas(container, extraScale){
    const canvas = container.querySelector('canvas.stf__canvas');
    if(!canvas) return;
    const dpr = (window.devicePixelRatio || 1) * (extraScale || 1);
    const cssW = canvas.clientWidth;
    const cssH = canvas.clientHeight;
    if(!cssW || !cssH) return;
    // cap the backing store so we don't hand the GPU an absurd canvas size
    const targetW = Math.min(Math.round(cssW * dpr), 4096);
    const targetH = Math.min(Math.round(cssH * dpr), 4096);
    if(canvas.width === targetW && canvas.height === targetH) return;
    canvas.width = targetW;
    canvas.height = targetH;
    const ctx = canvas.getContext('2d');
    ctx.scale(targetW / cssW, targetH / cssH);
  }

  function rebuildBook(){
    const savedPage = pageFlip ? pageFlip.getCurrentPageIndex() : 0;
    // don't call pageFlip.destroy() — it removes the #book element itself,
    // which we're about to recreate anyway; just drop the old DOM/listeners
    // by clearing zoomLayer (buildBook() does this) and building fresh.
    buildBook(savedPage);
  }

  buildBook(0);

  let resizeTimer;
  function scheduleRebuild(delay){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(rebuildBook, delay);
  }
  window.addEventListener('resize', () => scheduleRebuild(200));
  window.addEventListener('orientationchange', () => scheduleRebuild(250));
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(() => scheduleRebuild(50));
  }
  window.addEventListener('load', () => scheduleRebuild(50));

  const curPageEl = document.getElementById('curPage');
  const totalPagesEl = document.getElementById('totalPages');
  const sliderEl = document.getElementById('slider');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const prevBtnSide = document.getElementById('prevBtnSide');
  const nextBtnSide = document.getElementById('nextBtnSide');

  totalPagesEl.textContent = TOTAL_PAGES;
  sliderEl.max = TOTAL_PAGES;

  function updateUI(pageIndex){
    const shown = pageIndex + 1;
    curPageEl.textContent = shown;
    sliderEl.value = shown;
    const pct = ((shown-1)/(TOTAL_PAGES-1))*100;
    sliderEl.style.setProperty('--pct', pct + '%');
    prevBtn.classList.toggle('disabled', pageIndex <= 0);
    nextBtn.classList.toggle('disabled', pageIndex >= TOTAL_PAGES-1);
    prevBtnSide.classList.toggle('disabled', pageIndex <= 0);
    nextBtnSide.classList.toggle('disabled', pageIndex >= TOTAL_PAGES-1);
  }

  prevBtn.addEventListener('click', () => pageFlip.flipPrev());
  nextBtn.addEventListener('click', () => pageFlip.flipNext());
  prevBtnSide.addEventListener('click', () => pageFlip.flipPrev());
  nextBtnSide.addEventListener('click', () => pageFlip.flipNext());

  sliderEl.addEventListener('input', () => {
    pageFlip.flip(parseInt(sliderEl.value,10) - 1);
  });

  document.addEventListener('keydown', (e) => {
    if(e.key === 'ArrowRight') pageFlip.flipNext();
    if(e.key === 'ArrowLeft') pageFlip.flipPrev();
  });

  const fsBtn = document.getElementById('fsBtn');
  const fsSupported = !!(document.documentElement.requestFullscreen && document.fullscreenEnabled !== false);
  fsBtn.addEventListener('click', () => {
    if(!fsSupported){
      showTip('Helskärm på iPhone kräver att sidan läggs till på hemskärmen (dela-ikonen → "Lägg till på hemskärmen")');
      return;
    }
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen().catch(()=>{});
    } else {
      document.exitFullscreen();
    }
  });

  let tipTimer;
  function showTip(text){
    let tip = document.getElementById('tip');
    if(!tip){
      tip = document.createElement('div');
      tip.id = 'tip';
      tip.className = 'tip';
      document.querySelector('.stage').appendChild(tip);
    }
    tip.textContent = text;
    tip.classList.add('show');
    clearTimeout(tipTimer);
    tipTimer = setTimeout(() => tip.classList.remove('show'), 4500);
  }

  // remove hint on first interaction
  const hint = document.getElementById('hint');
  zoomLayer.addEventListener('click', () => hint.remove(), {once:true});

  // ── Zoom & pan ──────────────────────────────────────────
  const zoomLevelEl = document.getElementById('zoomLevel');
  const zoomInBtn = document.getElementById('zoomInBtn');
  const zoomOutBtn = document.getElementById('zoomOutBtn');

  const MIN_SCALE = 1;
  const MAX_SCALE = 3.5;
  let scale = 1, tx = 0, ty = 0;

  function clampPan(s, x, y){
    // don't let the image be dragged entirely out of view
    const rect = bookFrame.getBoundingClientRect();
    const maxX = (rect.width * (s - 1)) / 2 + rect.width * 0.15;
    const maxY = (rect.height * (s - 1)) / 2 + rect.height * 0.15;
    return [Math.max(-maxX, Math.min(maxX, x)), Math.max(-maxY, Math.min(maxY, y))];
  }

  let sharpenTimer;
  function applyTransform(){
    zoomLayer.style.transform = `scale(${scale}) translate(${tx/scale}px, ${ty/scale}px)`;
    zoomLayer.classList.toggle('zoomed', scale > 1.001);
    zoomLevelEl.textContent = Math.round(scale * 100) + '%';
    zoomOutBtn.classList.toggle('disabled', scale <= MIN_SCALE + 0.001);
    zoomInBtn.classList.toggle('disabled', scale >= MAX_SCALE - 0.001);

    // The CSS transform above gives instant visual feedback, but it's just
    // stretching the existing canvas pixels — still soft at anything above
    // 100%. Shortly after the zoom level settles, re-render the canvas at
    // that resolution so the magnified view is actually sharp, not just big.
    clearTimeout(sharpenTimer);
    sharpenTimer = setTimeout(() => {
      if(currentBookEl) sharpenCanvas(currentBookEl, scale);
    }, 120);
  }

  function setZoom(newScale, anchorX, anchorY){
    newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));
    const rect = bookFrame.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const ax = (anchorX ?? cx) - cx;
    const ay = (anchorY ?? cy) - cy;
    // content-space point currently under the anchor, then re-solve translate
    // so that same point stays under the anchor at the new scale.
    const px = (ax - tx) / scale;
    const py = (ay - ty) / scale;
    let newTx = ax - newScale * px;
    let newTy = ay - newScale * py;
    if(newScale <= MIN_SCALE + 0.001){ newTx = 0; newTy = 0; }
    [newTx, newTy] = clampPan(newScale, newTx, newTy);
    scale = newScale; tx = newTx; ty = newTy;
    applyTransform();
  }

  function resetZoom(){ scale = 1; tx = 0; ty = 0; applyTransform(); }

  zoomInBtn.addEventListener('click', () => setZoom(scale * 1.6));
  zoomOutBtn.addEventListener('click', () => setZoom(scale / 1.6));

  // (zoom reset on page flip is wired inside buildBook(), since pageFlip
  // itself gets recreated on resize)

  // desktop: wheel to zoom (also covers trackpad pinch, reported as ctrl+wheel)
  bookFrame.addEventListener('wheel', (e) => {
    e.preventDefault();
    const factor = Math.exp(-e.deltaY * 0.0018);
    setZoom(scale * factor, e.clientX, e.clientY);
  }, { passive:false });

  // Touch/mouse gestures: pinch to zoom, drag to pan while zoomed, and a
  // plain swipe to flip pages while at 100%. PageFlip's own mouse/touch
  // handling is switched off (useMouseEvents: false) so there's no risk of
  // it fighting our zoom/pan for the same touch — we own the whole surface
  // and flip pages ourselves via pageFlip.flipNext()/flipPrev().
  const SWIPE_THRESHOLD = 55; // px

  let pinchStartDist = 0, pinchStartScale = 1;
  let dragging = false, dragStartX = 0, dragStartY = 0, dragStartTx = 0, dragStartTy = 0;
  let gestureStartX = 0, gestureStartY = 0;

  function touchDist(t0, t1){
    return Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
  }
  function touchMid(t0, t1){
    return { x: (t0.clientX + t1.clientX) / 2, y: (t0.clientY + t1.clientY) / 2 };
  }
  function maybeSwipeFlip(dx, dy){
    if(Math.abs(dx) > SWIPE_THRESHOLD && Math.abs(dx) > Math.abs(dy)){
      if(dx < 0) pageFlip.flipNext(); else pageFlip.flipPrev();
    }
  }

  bookFrame.addEventListener('touchstart', (e) => {
    if(e.touches.length === 2){
      pinchStartDist = touchDist(e.touches[0], e.touches[1]);
      pinchStartScale = scale;
      dragging = false;
    } else if(e.touches.length === 1){
      gestureStartX = e.touches[0].clientX;
      gestureStartY = e.touches[0].clientY;
      if(scale > 1.01){
        dragging = true;
        zoomLayer.classList.add('dragging');
        dragStartX = gestureStartX; dragStartY = gestureStartY;
        dragStartTx = tx; dragStartTy = ty;
      }
    }
  }, { passive:true });

  bookFrame.addEventListener('touchmove', (e) => {
    if(e.touches.length === 2){
      e.preventDefault();
      const dist = touchDist(e.touches[0], e.touches[1]);
      const mid = touchMid(e.touches[0], e.touches[1]);
      const ratio = dist / (pinchStartDist || dist);
      setZoom(pinchStartScale * ratio, mid.x, mid.y);
    } else if(dragging && e.touches.length === 1){
      e.preventDefault();
      const dx = e.touches[0].clientX - dragStartX;
      const dy = e.touches[0].clientY - dragStartY;
      const [nx, ny] = clampPan(scale, dragStartTx + dx, dragStartTy + dy);
      tx = nx; ty = ny;
      applyTransform();
    }
  }, { passive:false });

  bookFrame.addEventListener('touchend', (e) => {
    if(dragging){
      dragging = false;
      zoomLayer.classList.remove('dragging');
    } else if(scale <= 1.01 && e.changedTouches && e.changedTouches.length === 1){
      const dx = e.changedTouches[0].clientX - gestureStartX;
      const dy = e.changedTouches[0].clientY - gestureStartY;
      maybeSwipeFlip(dx, dy);
    }
  });

  // desktop: drag to pan while zoomed, or drag to flip (swipe) at 100%
  let mouseDown = false, mousePanning = false;
  bookFrame.addEventListener('mousedown', (e) => {
    mouseDown = true;
    mousePanning = scale > 1.01;
    gestureStartX = dragStartX = e.clientX;
    gestureStartY = dragStartY = e.clientY;
    if(mousePanning){
      zoomLayer.classList.add('dragging');
      dragStartTx = tx; dragStartTy = ty;
      e.preventDefault();
    }
  });
  window.addEventListener('mousemove', (e) => {
    if(!mouseDown || !mousePanning) return;
    const dx = e.clientX - dragStartX;
    const dy = e.clientY - dragStartY;
    const [nx, ny] = clampPan(scale, dragStartTx + dx, dragStartTy + dy);
    tx = nx; ty = ny;
    applyTransform();
  });
  window.addEventListener('mouseup', (e) => {
    if(mouseDown && !mousePanning){
      maybeSwipeFlip(e.clientX - gestureStartX, e.clientY - gestureStartY);
    }
    mouseDown = false;
    mousePanning = false;
    zoomLayer.classList.remove('dragging');
  });

  // keyboard shortcuts: +/- to zoom, 0 to reset
  document.addEventListener('keydown', (e) => {
    if(e.key === '+' || e.key === '=') setZoom(scale * 1.3);
    if(e.key === '-' || e.key === '_') setZoom(scale / 1.3);
    if(e.key === '0') resetZoom();
  });

  // Safari (iOS/macOS) fires its own non-standard gesture events for pinch,
  // independent of touch events — block them outright so the browser never
  // tries to zoom the whole page while we're handling the pinch ourselves.
  ['gesturestart', 'gesturechange', 'gestureend'].forEach((type) => {
    document.addEventListener(type, (e) => e.preventDefault());
  });

  applyTransform();
</script>

</body>
</html>
