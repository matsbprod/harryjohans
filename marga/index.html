const { useState, useRef, useEffect, useCallback } = React;

];

const STATUSES = [
  { id: "backlog",     label: "Att göra",  icon: "○" },
  { id: "in_progress", label: "Pågående",  icon: "◑" },
  { id: "done",        label: "Klart",     icon: "●" },
];


const STORAGE_KEY = "boat_restoration_planner_v2";
const TOTAL_WEEKS = 120;

// ╔══════════════════════════════════════════════════════════╗
// ─── Supabase konfiguration ───

function isCloudConfigured() { return true; }
function isJsonBinConfigured() { return isCloudConfigured(); }

function apiHeaders() {
  return { "Content-Type": "application/json", "X-Marga-Password": localStorage.getItem(SITE_AUTH_KEY) === "1" ? SITE_PASSWORD : "" };
}

function normalizeTasks(arr) {
  if (!Array.isArray(arr)) return null;
  return arr.map(t => ({ ...t, files: (t.files || []).map(f => ({ ...f, type: f.type || detectFileType(f.name || f.url) })) }));
}

async function loadFromCloud() {
  try {
    const res = await fetch("/api/marga-data", { headers: apiHeaders() });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const record = await res.json();
    if (Array.isArray(record)) return { tasks: normalizeTasks(record), gallery: null };
    if (record && Array.isArray(record.tasks) && record.tasks.length) return { tasks: normalizeTasks(record.tasks), gallery: record.gallery || null };
    return null;
  } catch (e) { console.warn("Kunde inte hämta data:", e); return null; }
}

async function saveToCloud(tasks, gallery) {
  try {
    const res = await fetch("/api/marga-data", { method: "POST", headers: apiHeaders(), body: JSON.stringify({ tasks, gallery }) });
    return res.ok;
  } catch (e) { console.warn("Kunde inte spara data:", e); return false; }
}


// Debounce helper for combined save
function createDebouncedSaver(delayMs = 1500) {
  let timer = null;
  return function debouncedSave(tasks, gallery, onStatus) {
    if (timer) clearTimeout(timer);
    onStatus("saving");
    saveTasksLocal(tasks);
    saveGalleryLocal(gallery);
    if (!isCloudConfigured()) { onStatus("offline"); return; }
    timer = setTimeout(async () => {
      const ok = await saveToCloud(tasks, gallery);
      onStatus(ok ? "saved" : "error");
    }, delayMs);
  };
}

// ─── Sync Status Indicator Component ───
function SyncIndicator({ status }) {
  const configs = {
    idle:    { color: "#A89878", text: "—" },
    saving:  { color: "#D4A76A", text: "Sparar…" },
    saved:   { color: "#5B7F6E", text: "Synkad ✓" },
    error:   { color: "#C75B4A", text: "Synkfel ✗" },
    offline: { color: "#8A7D6B", text: "Lokal" },
    loading: { color: "#D4A76A", text: "Laddar…" },
  };
  const cfg = configs[status] || configs.idle;
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11, color: cfg.color, fontWeight: 600 }}>
      <span style={{ width: 7, height: 7, borderRadius: "50%", background: cfg.color, display: "inline-block", animation: status === "saving" || status === "loading" ? "pulse 1s infinite" : "none" }} />
      {cfg.text}
      <style>{"@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }"}</style>
    </div>
  );
}

// ─── Gallery Storage ───
const GALLERY_KEY = "boat_gallery_v1";
const GITHUB_REPO = "matsbprod/marga";
const GITHUB_RAW = "https://raw.githubusercontent.com/matsbprod/marga/main";
const GITHUB_API = "/api/marga-gh?path=";

const SITE_PASSWORD = "marga2025";
const SITE_AUTH_KEY = "marga_site_auth";

// GitHub read token — stored in localStorage, never in code
const GITHUB_TOKEN_KEY = "marga_gh_read_token";
function getGithubReadToken() { return localStorage.getItem(GITHUB_TOKEN_KEY) || ""; }
function setGithubReadToken(t) { if (t) localStorage.setItem(GITHUB_TOKEN_KEY, t); else localStorage.removeItem(GITHUB_TOKEN_KEY); }

function ghApiHeaders() {
  return { "X-Marga-Password": localStorage.getItem(SITE_AUTH_KEY) === "1" ? SITE_PASSWORD : "" };
}
const IMAGE_EXTS = ["jpg","jpeg","png","gif","webp","svg","bmp","tiff"];
const DOC_EXTS   = ["pdf","dwg","dxf","step","stp","stl","3dm","doc","docx","xls","xlsx","txt"];

function isImageFile(name) { const ext = name.split(".").pop().toLowerCase(); return IMAGE_EXTS.includes(ext); }
function isDocFile(name)   { const ext = name.split(".").pop().toLowerCase(); return DOC_EXTS.includes(ext); }

function getWeekLabel(week) {
  const d = new Date(2026, 2, 2);
  d.setDate(d.getDate() + (week - 1) * 7);
  return d.toLocaleDateString("sv-SE", { day: "numeric", month: "short" });
}

const DEFAULT_FOLDERS = [];
const DEFAULT_TASKS = [];

function loadTasksLocal() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      return parsed.map(t => ({ ...t, files: (t.files || []).map(f => ({ ...f, type: f.type || detectFileType(f.name || f.url) })) }));
    }
  } catch (e) { console.warn("Kunde inte ladda sparad data:", e); }
  return null;
}

function saveTasksLocal(tasks) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }
  catch (e) { console.warn("Kunde inte spara lokalt:", e); }
}

function loadGalleryLocal() {
  try {
    const raw = localStorage.getItem(GALLERY_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { console.warn("Kunde inte ladda bildarkiv:", e); }
  return DEFAULT_FOLDERS;
}

function saveGalleryLocal(folders) {
  try { localStorage.setItem(GALLERY_KEY, JSON.stringify(folders)); }
  catch (e) { console.warn("Kunde inte spara bildarkiv:", e); }
}

// ─── URL helpers — stödjer GitHub raw och Google Drive ───
function isGithubUrl(url) {
  return url && (url.includes("raw.githubusercontent.com") || url.includes("github.com"));
}

function isGdriveUrl(url) {
  return url && (url.includes("drive.google.com") || url.includes("docs.google.com"));
}

function extractGdriveId(url) {
  const patterns = [/\/file\/d\/([a-zA-Z0-9_-]+)/, /id=([a-zA-Z0-9_-]+)/, /\/d\/([a-zA-Z0-9_-]+)/];
  for (const p of patterns) { const m = url.match(p); if (m) return m[1]; }
  return null;
}

// Konvertera github.com blob-URL till raw
function toGithubRaw(url) {
  return url
    .replace("github.com", "raw.githubusercontent.com")
    .replace("/blob/", "/");
}

// Thumbnail/förhandsgransknings-URL för bilder
function fileThumbUrl(url) {
  if (!url) return url;
  if (isGdriveUrl(url)) {
    const id = extractGdriveId(url);
    return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w400` : url;
  }
  if (isGithubUrl(url)) return toGithubRaw(url);
  return url;
}

// Stor bild för lightbox
function fileViewUrl(url) {
  if (!url) return url;
  if (isGdriveUrl(url)) {
    const id = extractGdriveId(url);
    return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w1600` : url;
  }
  if (isGithubUrl(url)) return toGithubRaw(url);
  return url;
}

// Nedladdnings-URL
function fileDownloadUrl(url) {
  if (!url) return url;
  if (isGdriveUrl(url)) {
    const id = extractGdriveId(url);
    return id ? `https://drive.google.com/uc?export=download&id=${id}` : url;
  }
  if (isGithubUrl(url)) return toGithubRaw(url);
  return url;
}

// Öppna i webbläsare
function fileOpenUrl(url) {
  if (!url) return url;
  if (isGdriveUrl(url)) {
    const id = extractGdriveId(url);
    return id ? `https://drive.google.com/file/d/${id}/view` : url;
  }
  return url; // GitHub och övriga öppnas direkt
}

// ─── Lightbox ───
function Lightbox({ src, caption, onClose, images, currentIndex, onNavigate }) {
  // images = [{src, caption}], currentIndex = number
  const hasNav = images && images.length > 1;
  const hasPrev = hasNav && currentIndex > 0;
  const hasNext = hasNav && currentIndex < images.length - 1;

  useEffect(() => {
    const onKey = (e) => {
      if (e.key === "Escape") onClose();
      if (e.key === "ArrowLeft" && hasPrev) onNavigate(currentIndex - 1);
      if (e.key === "ArrowRight" && hasNext) onNavigate(currentIndex + 1);
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [currentIndex, hasPrev, hasNext]);

  if (!src) return null;

  const btnStyle = (enabled) => ({
    position: "fixed", top: "50%", transform: "translateY(-50%)",
    background: enabled ? "rgba(58,46,34,0.7)" : "rgba(58,46,34,0.2)",
    border: "none", borderRadius: "50%", width: 44, height: 44,
    color: enabled ? "#FFFDF8" : "rgba(255,253,248,0.3)",
    fontSize: 20, cursor: enabled ? "pointer" : "default",
    display: "flex", alignItems: "center", justifyContent: "center",
    zIndex: 3001, transition: "background 0.15s",
  });

  return (
    <div className="lightbox" onClick={onClose}>
      <img src={src} alt={caption || "Bild"} onClick={e => e.stopPropagation()} />
      {caption && <div className="lightbox-caption">{hasNav ? `${currentIndex + 1} / ${images.length} — ${caption}` : caption}</div>}
      {hasPrev && (
        <button style={{ ...btnStyle(true), left: 16 }} onClick={e => { e.stopPropagation(); onNavigate(currentIndex - 1); }}>‹</button>
      )}
      {hasNext && (
        <button style={{ ...btnStyle(true), right: 16 }} onClick={e => { e.stopPropagation(); onNavigate(currentIndex + 1); }}>›</button>
      )}
    </div>
  );
}

function detectFileType(nameOrUrl) {
  if (!nameOrUrl) return "doc";
  const name = nameOrUrl.split("?")[0].split("/").pop();
  const ext = name.split(".").pop().toLowerCase();
  if (IMAGE_EXTS.includes(ext)) return "image";
  if (ext === "pdf") return "pdf";
  if (["stl","3dm","step","stp","obj","glb","gltf"].includes(ext)) return "3d";
  return "doc";
}

function getFileTypeDef(type) {
  const defs = {
    image: { icon: "🖼", color: "#5B7F6E", label: "Bild" },
    pdf:   { icon: "📄", color: "#C75B4A", label: "PDF" },
    "3d":  { icon: "📐", color: "#7D6B91", label: "3D" },
    doc:   { icon: "📎", color: "#8B7355", label: "Fil" },
  };
  return defs[type] || defs.doc;
}

function showToast(msg) {
  const el = document.getElementById("toast");
  if (!el) return;
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2500);
}

// ─── File Card (single file row) ───
function FileCard({ file, index, onRemove, onPreview }) {
  const typeDef = getFileTypeDef(file.type || detectFileType(file.name || file.url));
  const isImage = (file.type || detectFileType(file.name || file.url)) === "image";
  const driveId = extractGdriveId(file.url);
  const showThumb = isImage && (driveId || isGithubUrl(file.url));
  return (
    <div className="file-card">
      {showThumb ? (
        <img src={fileThumbUrl(file.url)} alt={file.name}
          style={{ width: 40, height: 40, borderRadius: 6, objectFit: "cover", cursor: "pointer", flexShrink: 0, border: "1px solid #E5DDD0" }}
          onClick={() => onPreview(fileViewUrl(file.url), file.name)}
          onError={e => { e.target.style.display = "none"; e.target.nextSibling && (e.target.nextSibling.style.display = "flex"); }}
        />
      ) : null}
      <div className="file-icon" style={{ background: typeDef.color, display: showThumb ? "none" : "flex" }}>
        {typeDef.icon}
      </div>

      {/* Name & meta */}
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 13, fontWeight: 600, color: "#3A2E22", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{file.name}</div>
        <div style={{ fontSize: 10, color: "#A89878" }}>{typeDef.label} • {file.addedAt ? new Date(file.addedAt).toLocaleDateString("sv-SE") : ""}</div>
      </div>

      {/* Actions */}
      <div className="file-actions" style={{ display: "flex", gap: 2, flexShrink: 0 }}>
        {isImage && (
          <button onClick={() => onPreview(fileViewUrl(file.url), file.name)} title="Förhandsgranska" style={{ color: "#5B7F6E" }}>
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="3" stroke="currentColor" strokeWidth="1.5"/><path d="M2 10s3-6 8-6 8 6 8 6-3 6-8 6-8-6-8-6z" stroke="currentColor" strokeWidth="1.5"/></svg>
          </button>
        )}
        <a href={fileOpenUrl(file.url)} target="_blank" rel="noopener noreferrer" title="Öppna fil" style={{ color: "#5A7A8A" }}>
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M11 3h6v6M17 3L9 11M7 5H4a1 1 0 00-1 1v10a1 1 0 001 1h10a1 1 0 001-1v-3" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
        </a>
        <a href={fileDownloadUrl(file.url)} target="_blank" rel="noopener noreferrer" title="Ladda ner" style={{ color: "#6E7F8D" }}>
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M10 3v10m0 0l-3.5-3.5M10 13l3.5-3.5M3 16h14" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
        </a>
        <button onClick={() => onRemove(index)} title="Ta bort" style={{ color: "#C75B4A" }}>
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M6 6l8 8M14 6l-8 8" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>
        </button>
      </div>
    </div>
  );
}

// ─── File Attachments Section ───
function FileAttachments({ files, onChange, onPreview, taskTitle }) {
  function slugify(str) {
    return (str || "okant").toLowerCase().replace(/å/g,"a").replace(/ä/g,"a").replace(/ö/g,"o").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0, 40) || "okant";
  }
  const targetPath = "BILDER/uppgifter/" + slugify(taskTitle);
  return (
    <div style={{ marginTop: 14 }}>
      <div style={{ fontSize: 11, fontWeight: 700, color: "#8A7D6B", letterSpacing: "0.06em", textTransform: "uppercase", marginBottom: 8, display: "flex", alignItems: "center", gap: 6 }}>
        <svg width="14" height="14" viewBox="0 0 20 20" fill="none"><path d="M10.5 2.5l-6 6a4.24 4.24 0 006 6l6.5-6.5a2.83 2.83 0 00-4-4L6.5 10.5a1.41 1.41 0 002 2L14 7" stroke="#8A7D6B" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
        Bifogade filer ({files.length})
      </div>
      {files.length > 0 && (
        <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 12 }}>
          {files.map((f, i) => <FileCard key={i} file={f} index={i} onRemove={idx => onChange(files.filter((_, j) => j !== idx))} onPreview={onPreview} />)}
          {files.length > 1 && (
            <div style={{ textAlign: "right", marginTop: 2 }}>
              <button onClick={() => { files.forEach((f, i) => { setTimeout(() => { window.open(fileDownloadUrl(f.url), "_blank"); }, i * 500); }); showToast("Laddar ner alla filer…"); }}
                style={{ fontSize: 11, fontWeight: 700, color: "#5A7A8A", background: "none", border: "1.5px solid #5A7A8A", borderRadius: 6, padding: "5px 12px", cursor: "pointer" }}>
                ↓ Ladda ner alla ({files.length} filer)
              </button>
            </div>
          )}
        </div>
      )}
      <GithubUploader targetPath={targetPath} onUploaded={fileObj => onChange([...files, fileObj])} compact />
    </div>
  );
}

// ─── Kanban Card ───
function KanbanCard({ task, phases, onEdit, onDragStart, onDragOver, onDrop, onPreview }) {
  const phase = phases.find(p => p.id === task.phase);
  const files = task.files || [];
  const imageFiles = files.filter(f => (f.type || detectFileType(f.name || f.url)) === "image");
  const nonImageFiles = files.filter(f => (f.type || detectFileType(f.name || f.url)) !== "image");
  const filesByType = {};
  nonImageFiles.forEach(f => { const t = f.type || "other"; filesByType[t] = (filesByType[t] || 0) + 1; });
  const allImageObjs = imageFiles.map(f => ({ src: fileViewUrl(f.url), caption: f.name }));
  return (
    <div draggable
      onDragStart={e => { e.dataTransfer.setData("taskId", String(task.id)); onDragStart(task.id); }}
      onDragOver={e => { e.preventDefault(); e.stopPropagation(); if (onDragOver) onDragOver(task.id); }}
      onDrop={e => { e.preventDefault(); e.stopPropagation(); if (onDrop) onDrop(e); }}
      onClick={() => onEdit(task)}
      style={{ background: "#FFFDF8", borderRadius: 8, padding: "10px 12px", marginBottom: 8, cursor: "grab", borderLeft: `4px solid ${phase?.color || "#aaa"}`, boxShadow: "0 1px 3px rgba(80,60,40,0.08)", transition: "box-shadow 0.15s, transform 0.15s", fontSize: 13 }}
      onMouseEnter={e => { e.currentTarget.style.boxShadow = "0 3px 10px rgba(80,60,40,0.15)"; e.currentTarget.style.transform = "translateY(-1px)"; }}
      onMouseLeave={e => { e.currentTarget.style.boxShadow = "0 1px 3px rgba(80,60,40,0.08)"; e.currentTarget.style.transform = "translateY(0)"; }}
    >
      <div style={{ fontWeight: 600, color: "#3A2E22", marginBottom: 4, lineHeight: 1.3 }}>{task.title}</div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <span style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.05em", color: phase?.color, textTransform: "uppercase" }}>{phase?.label}</span>
        <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
          {Object.entries(filesByType).map(([type, count]) => { const def = getFileTypeDef(type); return <span key={type} style={{ fontSize: 8, fontWeight: 800, background: def.color, color: "#fff", padding: "1px 4px", borderRadius: 3, letterSpacing: "0.03em" }}>{def.icon} {count > 1 ? count : ""}</span>; })}
        </div>
      </div>
      {task.notes && <div style={{ fontSize: 11, color: "#8A7D6B", marginTop: 4, lineHeight: 1.35, whiteSpace: "pre-wrap" }}>{task.notes.length > 60 ? task.notes.slice(0, 60) + "…" : task.notes}</div>}
      {imageFiles.length > 0 && (
        <div style={{ display: "flex", gap: 4, marginTop: 8, flexWrap: "wrap" }} onClick={e => e.stopPropagation()}>
          {imageFiles.slice(0, 4).map((f, i) => (
            <div key={i} style={{ position: "relative" }}>
              <img src={fileThumbUrl(f.url)} alt={f.name}
                onClick={e => { e.stopPropagation(); if (onPreview) onPreview(fileViewUrl(f.url), f.name, allImageObjs, i); }}
                style={{ width: 48, height: 48, objectFit: "cover", borderRadius: 5, border: "1.5px solid #E5DDD0", cursor: "zoom-in", display: "block" }}
                onError={e => { e.target.style.display = "none"; }} />
              {i === 3 && imageFiles.length > 4 && (
                <div onClick={e => { e.stopPropagation(); if (onPreview) onPreview(fileViewUrl(imageFiles[3].url), imageFiles[3].name, allImageObjs, 3); }}
                  style={{ position: "absolute", inset: 0, background: "rgba(40,30,20,0.55)", borderRadius: 5, display: "flex", alignItems: "center", justifyContent: "center", cursor: "zoom-in" }}>
                  <span style={{ color: "#fff", fontSize: 11, fontWeight: 700 }}>+{imageFiles.length - 3}</span>
                </div>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ─── Gantt Chart ───
function GanttChart({ tasks, phases, onEdit, filterPhase, onUpdateTask }) {
  const filtered = filterPhase === "all" ? tasks : tasks.filter(t => t.phase === filterPhase);
  const sorted = filtered; // Preserve tasks array order (same as kanban)
  const [weekWidth, setWeekWidth] = useState(46);
  const rowHeight = 34, labelWidth = 250;
  const today = new Date(), projectStart = new Date(2026, 2, 2);
  const diffDays = Math.max(0, (today - projectStart) / (1000 * 60 * 60 * 24));
  const currentWeek = Math.min(TOTAL_WEEKS, 1 + diffDays / 7);

  const scrollRef = useRef(null);
  const dragging = useRef(null);
  const [dragState, setDragState] = useState({});
  const dragStateRef = useRef({});

  function updateDragState(taskId, val) {
    dragStateRef.current = { ...dragStateRef.current, [taskId]: val };
    setDragState({ ...dragStateRef.current });
  }

  useEffect(() => {
    if (scrollRef.current) {
      scrollRef.current.scrollLeft = Math.max(0, (currentWeek - 3) * weekWidth);
    }
  }, []);

  function onBarMouseDown(e, task, mode) {
    e.stopPropagation();
    e.preventDefault();
    dragging.current = { taskId: task.id, mode, startX: e.clientX, origStart: task.startWeek, origDuration: task.duration };
    updateDragState(task.id, { startWeek: task.startWeek, duration: task.duration });

    function onMouseMove(ev) {
      if (!dragging.current) return;
      const dx = ev.clientX - dragging.current.startX;
      const dWeeks = Math.round(dx / weekWidth);
      const { taskId, mode, origStart, origDuration } = dragging.current;
      const cur = dragStateRef.current[taskId] || { startWeek: origStart, duration: origDuration };
      if (mode === "move") {
        updateDragState(taskId, { startWeek: Math.max(1, Math.min(TOTAL_WEEKS, origStart + dWeeks)), duration: cur.duration });
      } else {
        updateDragState(taskId, { startWeek: cur.startWeek, duration: Math.max(1, Math.min(TOTAL_WEEKS - origStart + 1, origDuration + dWeeks)) });
      }
    }

    function onMouseUp() {
      if (!dragging.current) return;
      const { taskId } = dragging.current;
      const updated = dragStateRef.current[taskId];
      if (updated) onUpdateTask(taskId, updated);
      dragging.current = null;
      delete dragStateRef.current[taskId];
      setDragState({ ...dragStateRef.current });
      window.removeEventListener("mousemove", onMouseMove);
      window.removeEventListener("mouseup", onMouseUp);
    }

    window.addEventListener("mousemove", onMouseMove);
    window.addEventListener("mouseup", onMouseUp);
  }

  // Use dragState for live preview
  function getBar(t) {
    const ds = dragState[t.id];
    return { startWeek: ds?.startWeek ?? t.startWeek, duration: ds?.duration ?? t.duration };
  }

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10, justifyContent: "flex-end" }}>
        <span style={{ fontSize: 11, color: "#8A7D6B", fontWeight: 600 }}>Zoom</span>
        <button onClick={() => setWeekWidth(w => Math.max(20, w - 8))} style={{ width: 26, height: 26, border: "1px solid #DDD5C8", borderRadius: 6, background: "#FAF6EF", cursor: "pointer", fontSize: 15, color: "#5A4A38", display: "flex", alignItems: "center", justifyContent: "center" }}>−</button>
        <input type="range" min="20" max="120" value={weekWidth} onChange={e => setWeekWidth(+e.target.value)} style={{ width: 80, accentColor: "#5B7F6E", cursor: "pointer" }} />
        <button onClick={() => setWeekWidth(w => Math.min(120, w + 8))} style={{ width: 26, height: 26, border: "1px solid #DDD5C8", borderRadius: 6, background: "#FAF6EF", cursor: "pointer", fontSize: 15, color: "#5A4A38", display: "flex", alignItems: "center", justifyContent: "center" }}>+</button>
        <button onClick={() => setWeekWidth(46)} style={{ padding: "3px 8px", border: "1px solid #DDD5C8", borderRadius: 6, background: "#FAF6EF", cursor: "pointer", fontSize: 10, color: "#8A7D6B", fontWeight: 600 }}>1:1</button>
        <span style={{ fontSize: 10, color: "#A89878", marginLeft: 8 }}>Dra för att flytta · Dra i kanten för att ändra längd</span>
      </div>

      <div ref={scrollRef} style={{ overflow: "auto", borderRadius: 10, border: "1px solid #E5DDD0" }}>
      <div style={{ display: "flex", minWidth: labelWidth + TOTAL_WEEKS * weekWidth }}>
        <div style={{ width: labelWidth, flexShrink: 0, borderRight: "1px solid #E5DDD0", background: "#FAF6EF" }}>
          <div style={{ height: 36, borderBottom: "1px solid #E5DDD0", padding: "8px 12px", fontSize: 11, fontWeight: 700, color: "#8A7D6B", textTransform: "uppercase", letterSpacing: "0.06em" }}>Uppgift</div>
          {sorted.map(t => {
            const phase = phases.find(p => p.id === t.phase);
            return (
              <div key={t.id} onClick={() => onEdit(t)} style={{ height: rowHeight, display: "flex", alignItems: "center", padding: "0 12px", fontSize: 12, fontWeight: 500, color: "#3A2E22", borderBottom: "1px solid #F0EBE2", cursor: "pointer", gap: 6, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                <span style={{ width: 8, height: 8, borderRadius: "50%", background: phase?.color, flexShrink: 0 }} />
                <span style={{ overflow: "hidden", textOverflow: "ellipsis" }}>{t.title}</span>
                {(t.files||[]).length > 0 && <span style={{ fontSize: 9, color: "#A89878", flexShrink: 0 }}>📎{(t.files||[]).length}</span>}
              </div>
            );
          })}
        </div>
        <div style={{ flex: 1, position: "relative" }}>
          <div style={{ display: "flex", borderBottom: "1px solid #E5DDD0", height: 36 }}>
            {Array.from({ length: TOTAL_WEEKS }, (_, i) => (
              <div key={i} style={{ width: weekWidth, flexShrink: 0, textAlign: "center", fontSize: 10, color: "#8A7D6B", padding: "4px 0", borderRight: "1px solid #F0EBE2", lineHeight: 1.2, display: "flex", flexDirection: "column", justifyContent: "center" }}>
                <div style={{ fontWeight: 700 }}>V{i + 1}</div>
                {weekWidth >= 36 && <div>{getWeekLabel(i + 1)}</div>}
              </div>
            ))}
          </div>
          <div style={{ position: "relative" }}>
            <div style={{ position: "absolute", left: (currentWeek - 1) * weekWidth + weekWidth / 2 - 1, top: 0, bottom: 0, width: 2, background: "#C75B4A", opacity: 0.5, zIndex: 5, pointerEvents: "none" }} />
            {sorted.map(t => {
              const phase = phases.find(p => p.id === t.phase);
              const { startWeek, duration } = getBar(t);
              const left = (startWeek - 1) * weekWidth;
              const width = duration * weekWidth - 4;
              const isDraggingThis = !!dragState[t.id];
              const isDone = t.status === "done", isInProgress = t.status === "in_progress";
              return (
                <div key={t.id} style={{ height: rowHeight, position: "relative", borderBottom: "1px solid #F0EBE2" }}>
                  {Array.from({ length: TOTAL_WEEKS }, (_, i) => <div key={i} style={{ position: "absolute", left: i * weekWidth, top: 0, bottom: 0, width: 1, background: "#F0EBE2" }} />)}
                  <div
                    style={{ position: "absolute", left: left + 2, top: 6, width: Math.max(width, 16), height: rowHeight - 12,
                      background: isDone ? `repeating-linear-gradient(135deg, ${phase?.color}CC, ${phase?.color}CC 4px, ${phase?.color}99 4px, ${phase?.color}99 8px)` : isInProgress ? `linear-gradient(90deg, ${phase?.color}, ${phase?.color}BB)` : `${phase?.color}55`,
                      borderRadius: 5, border: `1.5px solid ${phase?.color}${isDraggingThis ? "" : ""}`,
                      boxShadow: isDraggingThis ? "0 4px 16px rgba(0,0,0,0.25)" : "none",
                      cursor: "grab", display: "flex", alignItems: "center", paddingLeft: 6, overflow: "hidden",
                      transform: isDraggingThis ? "scaleY(1.15)" : "scaleY(1)", transition: isDraggingThis ? "none" : "transform 0.12s",
                      userSelect: "none", zIndex: isDraggingThis ? 10 : 1,
                    }}
                    onMouseDown={e => onBarMouseDown(e, { ...t, startWeek, duration }, "move")}
                    onDoubleClick={() => onEdit(t)}
                  >
                    {width > 50 && <span style={{ fontSize: 10, fontWeight: 600, color: isDone || isInProgress ? "#fff" : "#3A2E22", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", textShadow: isDone || isInProgress ? "0 1px 2px rgba(0,0,0,0.2)" : "none", flex: 1 }}>{t.title}</span>}
                    {/* Resize handle — right edge */}
                    <div
                      onMouseDown={e => { e.stopPropagation(); onBarMouseDown(e, { ...t, startWeek, duration }, "resize"); }}
                      style={{ position: "absolute", right: 0, top: 0, bottom: 0, width: 8, cursor: "ew-resize", background: `${phase?.color}88`, borderRadius: "0 4px 4px 0", display: "flex", alignItems: "center", justifyContent: "center" }}
                    >
                      <div style={{ width: 2, height: 10, background: phase?.color, borderRadius: 1, margin: "0 1px" }} />
                      <div style={{ width: 2, height: 10, background: phase?.color, borderRadius: 1 }} />
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>
      </div>
      </div>
  );
}

// ─── Stats ───
function Stats({ tasks }) {
  const total = tasks.length;
  const done = tasks.filter(t => t.status === "done").length;
  const inProgress = tasks.filter(t => t.status === "in_progress").length;
  const totalFiles = tasks.reduce((sum, t) => sum + (t.files || []).length, 0);
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;

  const statItems = [
    { label: "Totalt uppgifter", value: total, color: "#3A2E22" },

    { label: "Pågående", value: inProgress, color: "#D4A76A" },
    { label: "Bifogade filer", value: totalFiles, color: "#5A7A8A" },

    <div style={{ display: "flex", gap: 16, flexWrap: "wrap", marginBottom: 20 }}>

        <div style={{ height: 10, background: "#E5DDD0", borderRadius: 5, overflow: "hidden" }}>

// ─── PDF Thumbnail (renders first page via PDF.js) ───
function PdfThumbnail({ url, onClick }) {
  const canvasRef = useRef(null);
  const [failed, setFailed] = useState(false);

  useEffect(() => {
    if (!window.pdfjsLib) { setFailed(true); return; }
    window.pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    let cancelled = false;
    window.pdfjsLib.getDocument({ url, withCredentials: false }).promise.then(pdf => {
      if (cancelled) return;
      return pdf.getPage(1);
    }).then(page => {
      if (cancelled || !canvasRef.current) return;
      const viewport = page.getViewport({ scale: 1 });
      const scale = 170 / viewport.width;
      const scaled = page.getViewport({ scale });
      const canvas = canvasRef.current;
      canvas.width = scaled.width;
      canvas.height = scaled.height;
      page.render({ canvasContext: canvas.getContext("2d"), viewport: scaled });
    }).catch(() => { if (!cancelled) setFailed(true); });
    return () => { cancelled = true; };
  }, [url]);

  if (failed) return (
    <div style={{ width: "100%", height: "100%", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 4 }}>
      <span style={{ fontSize: 32 }}>📄</span>
      <span style={{ fontSize: 11, fontWeight: 700, color: "#8A7D6B", background: "#E5DDD0", padding: "2px 6px", borderRadius: 4 }}>PDF</span>
    </div>
  );

  return (
    <canvas ref={canvasRef} onClick={onClick}
      style={{ width: "100%", height: "100%", objectFit: "cover", cursor: "zoom-in", display: "block" }} />
  );
}

// ─── PDF Page Canvas (renders one page) ───
function PdfPageCanvas({ pdf, pageNum, scale }) {
  const canvasRef = useRef(null);
  const renderTask = useRef(null);

  useEffect(() => {
    if (!pdf || !canvasRef.current) return;
    let cancelled = false;
    pdf.getPage(pageNum).then(page => {
      if (cancelled) return;
      const vp = page.getViewport({ scale });
      const canvas = canvasRef.current;
      if (!canvas) return;
      canvas.width = vp.width;
      canvas.height = vp.height;
      if (renderTask.current) { renderTask.current.cancel(); }
      renderTask.current = page.render({ canvasContext: canvas.getContext("2d"), viewport: vp });
      renderTask.current.promise.catch(() => {});
    });
    return () => { cancelled = true; if (renderTask.current) renderTask.current.cancel(); };
  }, [pdf, pageNum, scale]);

  return (
    <canvas ref={canvasRef} style={{ display: "block", borderRadius: 3, boxShadow: "0 2px 10px rgba(0,0,0,0.25)", margin: "0 auto" }} />
  );
}

// ─── PDF Viewer Modal ───
function PdfViewerModal({ url, name, onClose }) {
  const [pdf, setPdf] = useState(null);
  const [numPages, setNumPages] = useState(0);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");
  const [scale, setScale] = useState(1.4);

  useEffect(() => {
    if (!window.pdfjsLib) { setError("PDF.js ej tillgänglig"); setLoading(false); return; }
    window.pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    let cancelled = false;
    window.pdfjsLib.getDocument({ url, withCredentials: false }).promise
      .then(doc => {
        if (cancelled) return;
        setPdf(doc);
        setNumPages(doc.numPages);
        setLoading(false);
      })
      .catch(e => { if (!cancelled) { setError(e.message); setLoading(false); } });
    return () => { cancelled = true; };
  }, [url]);

  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(20,15,10,0.88)", zIndex: 9999, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "flex-start", overflowY: "auto" }}>
      {/* Sticky header */}
      <div onClick={e => e.stopPropagation()} style={{ position: "sticky", top: 0, zIndex: 10, width: "min(860px, 95vw)", background: "#FAF6EF", borderRadius: "0 0 10px 10px", borderBottom: "1px solid #E5DDD0", padding: "10px 16px", display: "flex", alignItems: "center", justifyContent: "space-between", boxShadow: "0 2px 12px rgba(0,0,0,0.3)" }}>
        <div style={{ fontSize: 13, fontWeight: 700, color: "#3A2E22", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", maxWidth: "40%" }}>📄 {name}</div>
        <div style={{ display: "flex", gap: 8, alignItems: "center", flexShrink: 0 }}>
          {numPages > 0 && <span style={{ fontSize: 11, color: "#8A7D6B" }}>{numPages} sidor</span>}
          <button onClick={() => setScale(s => Math.max(0.5, +(s - 0.2).toFixed(1)))} style={{ padding: "3px 9px", border: "1px solid #DDD5C8", borderRadius: 5, background: "#fff", cursor: "pointer", fontSize: 15, color: "#5A4A38", lineHeight: 1 }}>−</button>
          <span style={{ fontSize: 11, color: "#8A7D6B", minWidth: 38, textAlign: "center" }}>{Math.round(scale * 100)}%</span>
          <button onClick={() => setScale(s => Math.min(3, +(s + 0.2).toFixed(1)))} style={{ padding: "3px 9px", border: "1px solid #DDD5C8", borderRadius: 5, background: "#fff", cursor: "pointer", fontSize: 15, color: "#5A4A38", lineHeight: 1 }}>+</button>
          <a href={url} target="_blank" rel="noreferrer" onClick={e => e.stopPropagation()}
            style={{ padding: "5px 12px", background: "#5B7F6E", color: "#fff", borderRadius: 6, fontSize: 11, fontWeight: 700, textDecoration: "none" }}>↓ Ladda ner</a>
          <button onClick={onClose} style={{ padding: "5px 10px", background: "none", border: "1px solid #DDD5C8", borderRadius: 6, fontSize: 13, cursor: "pointer", color: "#6B5D4E" }}>✕</button>
        </div>
      </div>

      {/* Pages */}
      <div onClick={e => e.stopPropagation()} style={{ width: "min(860px, 95vw)", padding: "16px 0 40px", display: "flex", flexDirection: "column", gap: 12, overflowX: "auto" }}>
        {loading && <div style={{ padding: 60, color: "#C4B89E", fontSize: 13, textAlign: "center" }}>Laddar PDF…</div>}
        {error && <div style={{ padding: 20, color: "#C75B4A", fontSize: 13, textAlign: "center" }}>⚠ {error}</div>}
        {pdf && Array.from({ length: numPages }, (_, i) => (
          <PdfPageCanvas key={`${url}-${i}-${scale}`} pdf={pdf} pageNum={i + 1} scale={scale} />
        ))}
      </div>
    </div>
  );
}

// ─── GitHub Uploader — hardcoded accounts ───
// XOR-obfuskering: inte kryptografi men hindrar tokens från att synas i klartext
function xorObfuscate(str, key = "marga1918") {
  return Array.from(str).map((c, i) =>
    String.fromCharCode(c.charCodeAt(0) ^ key.charCodeAt(i % key.length))
  ).join("");
}
function encodeToken(tok) { return btoa(xorObfuscate(tok)); }
function decodeToken(enc) { return xorObfuscate(atob(enc), "marga1918"); }

// ║  KONTON — byt ut TOKEN_ENC mot encodeToken("ghp_xxx")  ║
// ║  Kör encodeToken("ghp_ditt_token") i webbkonsolen       ║
// ║  och klistra in resultatet som TOKEN_ENC nedan          ║
// ╚══════════════════════════════════════════════════════════╝
const UPLOAD_ACCOUNTS = [
  { id: "konto1", name: "Mats",    password: "marga1",  tokenEnc: "server" },
  { id: "konto2", name: "Konto 2", password: "marga2",  tokenEnc: "" },
  { id: "konto3", name: "Konto 3", password: "marga3",  tokenEnc: "" },
  { id: "konto4", name: "Konto 4", password: "marga4",  tokenEnc: "" },
];

const UPLOAD_SESSION_KEY = "marga_upload_account_ls";

function GithubUploader({ targetPath, onDone, onUploaded, compact }) {
  function getAutoSession() {
    if (localStorage.getItem(SITE_AUTH_KEY) === "1") {
      const account = UPLOAD_ACCOUNTS[0];
      if (account?.tokenEnc) return { id: account.id, name: account.name };
    }
    const saved = localStorage.getItem(UPLOAD_SESSION_KEY);
    return saved ? JSON.parse(saved) : null;
  }
  const [loggedIn, setLoggedIn] = useState(getAutoSession);
  const [selectedId, setSelectedId] = useState(UPLOAD_ACCOUNTS[0].id);
  const [password, setPassword] = useState("");
  const [loginError, setLoginError] = useState("");
  const [queue, setQueue] = useState([]);
  const [dragging, setDragging] = useState(false);
  const effectiveLogin = loggedIn || getAutoSession();
  const inputStyle = { padding: "7px 10px", borderRadius: 6, border: "1.5px solid #DDD5C8", background: "#FFFDF8", fontSize: 12, color: "#3A2E22", outline: "none", fontFamily: "inherit" };

  function login() {
    const account = UPLOAD_ACCOUNTS.find(a => a.id === selectedId);
    if (!account) return;
    if (account.password !== password) { setLoginError("Fel lösenord"); return; }
    if (!account.tokenEnc) { setLoginError("Token ej konfigurerat"); return; }
    const session = { id: account.id, name: account.name };
    localStorage.setItem(UPLOAD_SESSION_KEY, JSON.stringify(session));
    setLoggedIn(session); setPassword(""); setLoginError("");
  }
  function logout() { localStorage.removeItem(UPLOAD_SESSION_KEY); setLoggedIn(null); setQueue([]); }

  function addFiles(newFiles) {
    setQueue(prev => [...prev, ...Array.from(newFiles).map(f => ({ file: f, status: "idle", msg: "" }))]);
  }
  async function uploadOne(idx) {
    setQueue(prev => prev.map((e,i) => i===idx ? {...e, status:"uploading"} : e));
    const f = queue[idx].file;
    try {
      const base64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = e => res(e.target.result.split(",")[1]); r.onerror = () => rej(new Error("Läsfel")); r.readAsDataURL(f); });
      const path = `${targetPath}/${f.name}`;
      const res = await fetch("/api/marga-upload", {
        method: "POST", headers: apiHeaders(),
        body: JSON.stringify({ path, content: base64, message: `${effectiveLogin.name}: laddar upp ${f.name}` }),
      });
      if (!res.ok) { const err = await res.json().catch(() => ({})); throw new Error(err.error || `HTTP ${res.status}`); }
      setQueue(prev => prev.map((e,i) => i===idx ? {...e, status:"done"} : e));
      if (onUploaded) onUploaded({ url: `${GITHUB_RAW}/${path}`, name: f.name, type: detectFileType(f.name), addedAt: new Date().toISOString() });
    } catch(e) { setQueue(prev => prev.map((e2,i) => i===idx ? {...e2, status:"error", msg:e.message} : e2)); }
  }
  async function uploadAll() {
    for (let i = 0; i < queue.length; i++) { if (queue[i].status === "idle") await uploadOne(i); }
  }
  function onDrop(e) { e.preventDefault(); setDragging(false); if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files); }
  const inputId = `file-input-${targetPath.replace(/\//g,"-")}`;
  const pendingCount = queue.filter(e => e.status === "idle").length;
  const doneCount = queue.filter(e => e.status === "done").length;

  if (!effectiveLogin) return (
    <div style={{ background: "#FAF6EF", border: "1.5px dashed #DDD5C8", borderRadius: compact ? 8 : 10, padding: compact ? 12 : 16, marginTop: compact ? 0 : 16 }}>
      <div style={{ fontSize: 11, fontWeight: 700, color: "#8A7D6B", textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 10 }}>↑ Ladda upp till GitHub</div>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
        <select value={selectedId} onChange={e => { setSelectedId(e.target.value); setLoginError(""); }} style={{ ...inputStyle, cursor: "pointer" }}>
          {UPLOAD_ACCOUNTS.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
        </select>
        <input type="password" placeholder="Lösenord…" value={password} onChange={e => { setPassword(e.target.value); setLoginError(""); }} onKeyDown={e => e.key === "Enter" && login()} style={{ ...inputStyle, width: 130 }} />
        <button onClick={login} disabled={!password} style={{ padding: "7px 14px", background: password ? "#5B7F6E" : "#E5DDD0", color: password ? "#fff" : "#A89878", border: "none", borderRadius: 6, fontWeight: 700, fontSize: 12, cursor: password ? "pointer" : "default" }}>Logga in</button>
      </div>
      {loginError && <div style={{ fontSize: 11, color: "#C75B4A", marginTop: 6, fontWeight: 600 }}>{loginError}</div>}
    </div>
  );

  return (
    <div style={{ marginTop: compact ? 0 : 16 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 6 }}>
        <div style={{ fontSize: 11, fontWeight: 700, color: "#5B7F6E", textTransform: "uppercase", letterSpacing: "0.06em" }}>↑ Ladda upp — {effectiveLogin.name}</div>
        {loggedIn && !localStorage.getItem(SITE_AUTH_KEY) && <button onClick={logout} style={{ fontSize: 10, color: "#A89878", background: "none", border: "none", cursor: "pointer" }}>Logga ut</button>}
      </div>
      <div onDragOver={e => { e.preventDefault(); setDragging(true); }} onDragLeave={() => setDragging(false)} onDrop={onDrop}
        onClick={() => document.getElementById(inputId)?.click()}
        style={{ border: `2px dashed ${dragging ? "#5B7F6E" : "#C4B89E"}`, borderRadius: 8, padding: "14px", textAlign: "center", cursor: "pointer", background: dragging ? "rgba(91,127,110,0.06)" : "#FAF6EF", transition: "all 0.15s" }}>
        <input id={inputId} type="file" multiple style={{ display: "none" }} onChange={e => { if (e.target.files.length) addFiles(e.target.files); e.target.value=""; }} />
        <div style={{ fontSize: 18, marginBottom: 2 }}>↑</div>
        <div style={{ fontSize: 12, color: "#8A7D6B" }}>Dra hit eller klicka — flera filer OK</div>
      </div>
      {queue.length > 0 && (
        <div style={{ marginTop: 6, display: "flex", flexDirection: "column", gap: 3 }}>
          {queue.map((e, i) => (
            <div key={i} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11, padding: "3px 6px", background: e.status==="done" ? "rgba(91,127,110,0.07)" : e.status==="error" ? "rgba(199,91,74,0.07)" : "#FAF6EF", borderRadius: 5 }}>
              <span style={{ flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", color: "#3A2E22" }}>{e.file.name}</span>
              <span style={{ fontSize: 10, flexShrink: 0, color: e.status==="done" ? "#5B7F6E" : e.status==="error" ? "#C75B4A" : e.status==="uploading" ? "#C9A84C" : "#A89878" }}>
                {e.status==="uploading" ? "laddar…" : e.status==="done" ? "✓" : e.status==="error" ? `✗ ${e.msg}` : `${(e.file.size/1024).toFixed(0)} KB`}
              </span>
              {e.status === "idle" && <button onClick={() => setQueue(prev => prev.filter((_,j)=>j!==i))} style={{ fontSize: 10, color: "#A89878", background: "none", border: "none", cursor: "pointer", padding: "0 2px" }}>✕</button>}
            </div>
          ))}
        </div>
      )}
      {pendingCount > 0 && <button onClick={uploadAll} style={{ marginTop: 6, width: "100%", padding: "8px 0", background: "#5B7F6E", color: "#fff", border: "none", borderRadius: 7, fontWeight: 700, fontSize: 12, cursor: "pointer" }}>↑ Ladda upp {pendingCount} {pendingCount===1?"fil":"filer"}</button>}
      {doneCount > 0 && pendingCount === 0 && <button onClick={() => setQueue([])} style={{ marginTop: 6, width: "100%", padding: "6px 0", background: "none", border: "1px solid #DDD5C8", borderRadius: 7, color: "#8A7D6B", fontSize: 11, cursor: "pointer" }}>Rensa ({doneCount} uppladdade)</button>}
    </div>
  );
}

// ─── Image Gallery ───
function ImageGallery({ onPreview, folders, setFolders, onOpen3dModel }) {
  const [ghFolders, setGhFolders] = useState([]);
  const [activeFolder, setActiveFolder] = useState(null);
  const [folderFiles, setFolderFiles] = useState([]);
  const [ghLoading, setGhLoading] = useState(false);
  const [ghError, setGhError] = useState("");
  const [pdfViewer, setPdfViewer] = useState(null);

  const inputStyle = { padding: "8px 10px", borderRadius: 7, border: "1.5px solid #DDD5C8", background: "#FBF8F2", fontSize: 13, color: "#3A2E22", outline: "none", fontFamily: "inherit" };

  // Fetch top-level folders from GitHub on mount
  useEffect(() => {
    fetchGhFolders();
  }, []);

  async function fetchGhFolders() {
    setGhLoading(true);
    setGhError("");
    try {
      const res = await fetch(`${GITHUB_API}`, { headers: ghApiHeaders() });
      if (!res.ok) {
        const errBody = await res.json().catch(() => ({}));
        throw new Error(`GitHub API: HTTP ${res.status}${errBody.message ? ` — ${errBody.message}` : ""}`);
      }
      const items = await res.json();
      // Get all subdirectories (bilder/, dokument/, 3d-modeller/ etc.)
      const topDirs = items.filter(i => i.type === "dir");
      // Recursively collect all sub-folders
      const allFolders = [];
      for (const dir of topDirs) {
        const sub = await fetch(`${GITHUB_API}/${dir.name}`, { headers: ghApiHeaders() });
        if (!sub.ok) continue;
        const subItems = await sub.json();
        const subDirs = subItems.filter(i => i.type === "dir");
        if (subDirs.length > 0) {
          for (const sd of subDirs) {
            allFolders.push({ path: sd.path, name: sd.name, parent: dir.name, thumb: null });
          }
          // Fetch thumbnails for each subfolder
          for (const sd of subDirs) {
            const subRes = await fetch(`${GITHUB_API}/${sd.path}`, { headers: ghApiHeaders() });
            if (!subRes.ok) continue;
            const subSubItems = await subRes.json();
            const firstImg = subSubItems.find(i => i.type === "file" && isImageFile(i.name));
            const first3dm = subSubItems.find(i => i.type === "file" && i.name.toLowerCase().endsWith(".3dm"));
            const firstPdf = subSubItems.find(i => i.type === "file" && i.name.toLowerCase().endsWith(".pdf"));
            const folderEntry = allFolders.find(f => f.path === sd.path);
            if (folderEntry) {
              if (firstImg) folderEntry.thumb = `${GITHUB_RAW}/${sd.path}/${firstImg.name}`;
              else if (firstPdf) folderEntry.hasPdf = true;
              else if (first3dm) folderEntry.has3dm = true;
            }
          }
        } else {
          const hasFiles = subItems.some(i => i.type === "file" && (isImageFile(i.name) || isDocFile(i.name)));
          if (hasFiles) {
            const firstImg = subItems.find(i => i.type === "file" && isImageFile(i.name));
            const firstPdf = subItems.find(i => i.type === "file" && i.name.toLowerCase().endsWith(".pdf"));
            const first3dm = subItems.find(i => i.type === "file" && i.name.toLowerCase().endsWith(".3dm"));
            allFolders.push({
              path: dir.path, name: dir.name, parent: "",
              thumb: firstImg ? `${GITHUB_RAW}/${dir.path}/${firstImg.name}` : null,
              hasPdf: !!firstPdf,
              has3dm: !!first3dm,
            });
          }
        }
      }
      setGhFolders(allFolders);
    } catch(e) {
      setGhError(e.message);
    }
    setGhLoading(false);
  }

  async function openFolder(folder) {
    setActiveFolder(folder);
    setFolderFiles([]);
    setGhLoading(true);
    try {
      const res = await fetch(`${GITHUB_API}/${folder.path}`, { headers: ghApiHeaders() });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const items = await res.json();
      const files = items.filter(i => i.type === "file" && (isImageFile(i.name) || isDocFile(i.name)));
      setFolderFiles(files);
      // Update thumb if not set
      if (!folder.thumb) {
        const firstImg = files.find(f => isImageFile(f.name));
        if (firstImg) {
          setGhFolders(prev => prev.map(f => f.path === folder.path ? { ...f, thumb: `${GITHUB_RAW}/${firstImg.path}` } : f));
        }
      }
    } catch(e) {
      setGhError(e.message);
    }
    setGhLoading(false);
  }

  const groupedFolders = ghFolders.reduce((acc, f) => {
    const key = f.parent || "Övrigt";
    if (!acc[key]) acc[key] = [];
    acc[key].push(f);
    return acc;
  }, {});

  // Sort groups: PDF first, then BILDER, then rest
  const groupOrder = ["PDF", "BILDER", "Övrigt"];
  const sortedGroups = Object.entries(groupedFolders).sort(([a], [b]) => {
    const ai = groupOrder.findIndex(g => g.toLowerCase() === a.toLowerCase());
    const bi = groupOrder.findIndex(g => g.toLowerCase() === b.toLowerCase());
    return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
  });

  function folderThumb(f) {
    const nameLower = f.path.toLowerCase();
    const is3d = nameLower.includes("3d") || nameLower.includes("modell") || f.has3dm;
    const isPdfFolder = nameLower.includes("pdf") || (f.parent || "").toLowerCase() === "pdf" || f.hasPdf;

    if (f.thumb) {
      return (
        <img src={f.thumb} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }}
          onError={e => { e.target.style.display = "none"; e.target.parentNode.innerHTML = '<span style="font-size:18px">📁</span>'; }} />
      );
    }
    if (isPdfFolder) return <span style={{ fontSize: 20 }}>📄</span>;
    if (is3d) return <span style={{ fontSize: 20 }}>◈</span>;
    return <span style={{ fontSize: 18 }}>📁</span>;
  }

  function saveToken() {
    setGithubReadToken(tokenInput.trim());
    setHasToken(!!tokenInput.trim());
    setTokenInput("");
    setShowTokenInput(false);
    setGhError("");
    fetchGhFolders();
  }

  function clearToken() {
    setGithubReadToken("");
    setHasToken(false);
    setGhFolders([]);
  }

  return (
    <div>
      {pdfViewer && <PdfViewerModal url={pdfViewer.url} name={pdfViewer.name} onClose={() => setPdfViewer(null)} />}
      {/* Header */}
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 20, flexWrap: "wrap", gap: 10 }}>
        <div>
          <h2 style={{ margin: 0, fontFamily: "'Playfair Display', Georgia, serif", color: "#3A2E22", fontSize: 22 }}>Bildarkiv</h2>
          <p style={{ margin: "4px 0 0", fontSize: 12, color: "#8A7D6B" }}>
            GitHub: {GITHUB_REPO} •
            <span style={{ marginLeft: 6, cursor: "pointer", color: "#5B7F6E", fontWeight: 600 }} onClick={fetchGhFolders}>⟳ Uppdatera</span>
          </p>
        </div>
        <a href={`https://github.com/${GITHUB_REPO}`} target="_blank" rel="noreferrer"
          style={{ padding: "8px 14px", background: "#3A2E22", color: "#C4B89E", borderRadius: 8, fontSize: 12, fontWeight: 700, textDecoration: "none" }}>
          ↗ Öppna GitHub
        </a>
      </div>

      {ghError && (
        <div style={{ padding: "10px 14px", background: "#FFF0ED", borderRadius: 8, border: "1px solid #F5C4BA", fontSize: 12, color: "#C75B4A", marginBottom: 16 }}>
          ⚠ {ghError}
        </div>
      )}

      <div style={{ display: "flex", gap: 20, minHeight: 500 }}>
        {/* Sidebar */}
        <div style={{ width: 220, flexShrink: 0 }}>
          {ghLoading && !activeFolder && (
            <div style={{ color: "#A89878", fontSize: 12, padding: 12 }}>Hämtar mappar…</div>
          )}
          {sortedGroups.map(([group, foldersInGroup]) => (
            <div key={group} style={{ marginBottom: 12 }}>
              <div style={{ fontSize: 10, fontWeight: 700, color: "#A89878", textTransform: "uppercase", letterSpacing: "0.06em", padding: "4px 8px", marginBottom: 4 }}>{group}</div>
              {foldersInGroup.map(f => (
                <div key={f.path}
                  onClick={() => openFolder(f)}
                  style={{
                    display: "flex", alignItems: "center", gap: 10, padding: "7px 10px",
                    borderRadius: 8, cursor: "pointer", marginBottom: 3,
                    background: activeFolder?.path === f.path ? "#FFFDF8" : "transparent",
                    border: activeFolder?.path === f.path ? "1.5px solid #E5DDD0" : "1.5px solid transparent",
                    boxShadow: activeFolder?.path === f.path ? "0 2px 8px rgba(80,60,40,0.06)" : "none",
                    transition: "all 0.15s",
                  }}
                  onMouseEnter={e => { if (activeFolder?.path !== f.path) e.currentTarget.style.background = "rgba(255,253,248,0.5)"; }}
                  onMouseLeave={e => { if (activeFolder?.path !== f.path) e.currentTarget.style.background = "transparent"; }}
                >
                  <div style={{ width: 36, height: 36, borderRadius: 6, overflow: "hidden", flexShrink: 0, background: "#E8E0D4", display: "flex", alignItems: "center", justifyContent: "center" }}>
                    {folderThumb(f)}
                  </div>
                  <div style={{ fontSize: 13, fontWeight: 600, color: "#3A2E22", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{f.name}</div>
                </div>
              ))}
            </div>
          ))}
        </div>

        {/* File grid */}
        <div style={{ flex: 1, minWidth: 0 }}>
          {!activeFolder ? (
            <div style={{ display: "flex", alignItems: "center", justifyContent: "center", height: 300, color: "#A89878", fontSize: 14, flexDirection: "column", gap: 12 }}>
              <svg width="48" height="48" viewBox="0 0 48 48" fill="none"><rect x="6" y="10" width="36" height="28" rx="4" stroke="#C4B89E" strokeWidth="2"/><circle cx="18" cy="22" r="4" stroke="#C4B89E" strokeWidth="1.5"/><path d="M6 32l10-8 6 5 8-10 12 13" stroke="#C4B89E" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
              <span>Välj en mapp till vänster</span>
              <div style={{ fontSize: 11, color: "#C4B89E", textAlign: "center", maxWidth: 280 }}>
                Filer laddas direkt från GitHub-repot. Lägg till filer via GitHub Desktop och tryck ⟳ Uppdatera.
              </div>
            </div>
          ) : (
            <div>
              {/* Folder header */}
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <div style={{ width: 36, height: 36, borderRadius: 6, overflow: "hidden", flexShrink: 0, background: "#E8E0D4", display: "flex", alignItems: "center", justifyContent: "center" }}>
                    {activeFolder.thumb ? <img src={activeFolder.thumb} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} /> : <span style={{ fontSize: 18 }}>📁</span>}
                  </div>
                  <h3 style={{ margin: 0, fontFamily: "'Playfair Display', Georgia, serif", color: "#3A2E22", fontSize: 18 }}>{activeFolder.name}</h3>
                  <span style={{ fontSize: 12, color: "#A89878" }}>({folderFiles.length} filer)</span>
                </div>

                    const imgIndex = allImages.findIndex(i => i.src === rawUrl);
                    const is3dm = file.name.toLowerCase().endsWith(".3dm");
                    const handleClick = () => {
                      if (isImg) onPreview(rawUrl, file.name, allImages, imgIndex);
                      else if (isPdf) setPdfViewer({ url: rawUrl, name: file.name });
                      else if (is3dm && onOpen3dModel) onOpen3dModel(rawUrl);
                      else window.open(rawUrl, "_blank");
                    };
                    return (
                      <div key={idx}
                        style={{ background: "#FFFDF8", borderRadius: 10, border: "1.5px solid #E5DDD0", overflow: "hidden", transition: "box-shadow 0.15s, transform 0.15s", cursor: "pointer" }}
                        onMouseEnter={e => { e.currentTarget.style.boxShadow = "0 4px 16px rgba(80,60,40,0.12)"; e.currentTarget.style.transform = "translateY(-2px)"; }}
                        onMouseLeave={e => { e.currentTarget.style.boxShadow = "none"; e.currentTarget.style.transform = "none"; }}
                        onClick={handleClick}
                      >
                        {/* Thumbnail */}
                        <div style={{ width: "100%", height: 130, background: "#F0EBE2", overflow: "hidden", position: "relative" }}>

                              <span style={{ fontSize: 11, fontWeight: 700, color: "#8A7D6B", background: "#E5DDD0", padding: "2px 6px", borderRadius: 4 }}>{ext}</span>
                            </div>
                          )}
                        </div>
                        {/* Name + actions */}
                        <div style={{ padding: "8px 10px" }}>
                          <div style={{ fontSize: 12, fontWeight: 600, color: "#3A2E22", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }} title={file.name}>{file.name}</div>
                          <div style={{ display: "flex", gap: 6, marginTop: 6 }}>
                            {(isImg || isPdf || is3dm) && (
                              <button onClick={e => { e.stopPropagation(); handleClick(); }}
                                style={{ flex: 1, padding: "4px 0", fontSize: 10, fontWeight: 700, background: "#F0EBE2", border: "none", borderRadius: 5, cursor: "pointer", color: "#5A4A38" }}>
                                {isPdf ? "📄 Öppna" : is3dm ? "◈ 3D-vy" : "👁 Visa"}
                              </button>
                            )}
                            <a href={rawUrl} download target="_blank" rel="noreferrer" onClick={e => e.stopPropagation()}
                              style={{ flex: 1, padding: "4px 0", fontSize: 10, fontWeight: 700, background: "#E8F0EC", border: "none", borderRadius: 5, cursor: "pointer", color: "#3A5A4A", textDecoration: "none", textAlign: "center" }}>↓ Ladda ner</a>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
              <GithubUploader targetPath={activeFolder.path} onDone={() => openFolder(activeFolder)} />
            </div>
          )}
        </div>
      </div>
    </div>
  );
}
