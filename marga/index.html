<head>

  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.9/babel.min.js"></script>
  <style>
    body { background: #F5F0E8; min-height: 100vh; }
    #marga-root { padding: 80px 0 40px; }

    /* ── Login overlay ── */
    .marga-login {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: 'Cormorant Garamond', Georgia, serif;
    }
    .marga-login-box {
      background: #FFFDF8; border-radius: 16px; padding: 48px 40px 40px;
      box-shadow: 0 8px 40px rgba(80,60,40,0.13); width: 340px; text-align: center;
    }

    /* ── App shell ── */
    .marga-app { max-width: 1400px; margin: 0 auto; padding: 0 24px; font-family: 'Archivo', sans-serif; }

    /* ── Header ── */
    .marga-header {
      background: linear-gradient(135deg, #1a1a2e 0%, #2d2d44 50%, #1a2a3a 100%);
      border-radius: 12px; padding: 16px 24px; margin-bottom: 20px;
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    }
    .marga-header h1 { margin: 0; color: #C4B89E; font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 400; letter-spacing: 0.08em; }
    .marga-header-sub { color: #8A7D6B; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; }
    .marga-nav-btn {
      padding: 6px 12px; border: 1px solid rgba(255,253,248,0.2); border-radius: 7px;
      background: transparent; color: #C4B89E; font-size: 11px; font-weight: 600; cursor: pointer;
      font-family: inherit;
    }
    .marga-nav-btn:hover { background: rgba(255,253,248,0.08); }

    /* ── Tabs ── */
    .marga-tabs { display: flex; gap: 4px; border-bottom: 2px solid #E5DDD0; margin-bottom: 20px; }
    .marga-tab {
      padding: 8px 18px; border: none; background: none; font-family: inherit;
      font-size: 13px; font-weight: 600; color: #8A7D6B; cursor: pointer;
      border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.15s;
    }
    .marga-tab.active { color: #3A2E22; border-bottom-color: #3A2E22; }
    .marga-tab:hover { color: #3A2E22; }

    /* ── Kanban ── */
    .kanban-board { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 8px; }
    .kanban-col { min-width: 220px; max-width: 260px; flex: 1 1 220px; background: transparent; border-radius: 12px; padding: 10px; }
    .kanban-col-header { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; padding: 4px 0; border-bottom: 2px solid #E5DDD0; }
    .kanban-card {
      background: #FFFDF8; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px;
      cursor: grab; border-left: 4px solid #aaa;
      box-shadow: 0 1px 3px rgba(80,60,40,0.08); transition: box-shadow 0.15s, transform 0.15s;
    }
    .kanban-card:hover { box-shadow: 0 3px 10px rgba(80,60,40,0.15); transform: translateY(-1px); }

    /* ── Gantt ── */
    .gantt-wrap { overflow-x: auto; }
    .gantt-row { display: flex; align-items: center; border-bottom: 1px solid #F0EBE2; }
    .gantt-label { width: 180px; flex-shrink: 0; padding: 6px 10px; font-size: 12px; color: #3A2E22; }
    .gantt-bar-area { flex: 1; position: relative; height: 32px; }
    .gantt-bar { position: absolute; top: 6px; height: 20px; border-radius: 4px; opacity: 0.85; }

    /* ── Modal ── */
    .marga-modal-bg {
      position: fixed; inset: 0; background: rgba(30,20,10,0.55);
      display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px;
    }
    .marga-modal {
      background: #FFFDF8; border-radius: 14px; padding: 28px 28px 20px;
      width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto;
      box-shadow: 0 20px 60px rgba(30,20,10,0.25);
    }
    .marga-modal h2 { margin: 0 0 20px; font-family: 'Cormorant Garamond', serif; font-size: 22px; color: #3A2E22; }
    .marga-field { margin-bottom: 14px; }
    .marga-label { display: block; font-size: 11px; font-weight: 700; color: #8A7D6B; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 5px; }
    .marga-input {
      width: 100%; padding: 9px 12px; border-radius: 8px; border: 1.5px solid #DDD5C8;
      background: #FAF6EF; color: #3A2E22; font-size: 14px; font-family: inherit;
      outline: none; box-sizing: border-box; transition: border 0.15s;
    }
    .marga-input:focus { border-color: #8A7D6B; }
    .marga-btn {
      padding: 9px 18px; border: none; border-radius: 8px; font-size: 13px;
      font-weight: 700; cursor: pointer; font-family: inherit; transition: all 0.15s;
    }
    .marga-btn-primary { background: #5B7F6E; color: #fff; }
    .marga-btn-primary:hover { background: #4a6b5c; }
    .marga-btn-danger { background: #C75B4A; color: #fff; }
    .marga-btn-secondary { background: #E5DDD0; color: #6B5D4E; }

    /* ── Upload dropzone ── */
    .marga-dropzone {
      border: 2px dashed #C4B89E; border-radius: 8px; padding: 14px;
      text-align: center; cursor: pointer; background: #FAF6EF; transition: all 0.15s;
    }
    .marga-dropzone:hover, .marga-dropzone.drag { border-color: #5B7F6E; background: rgba(91,127,110,0.06); }

    /* ── File cards ── */
    .file-card { display: flex; align-items: center; gap: 10px; padding: 7px 10px; background: #FAF6EF; border-radius: 8px; border: 1px solid #E5DDD0; }
    .file-icon { width: 36px; height: 36px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; color: #fff; }

    /* ── Lightbox ── */
    .marga-lightbox { position: fixed; inset: 0; background: rgba(10,8,5,0.92); z-index: 2000; display: flex; align-items: center; justify-content: center; }
    .marga-lightbox img { max-width: 90vw; max-height: 85vh; border-radius: 4px; object-fit: contain; }

    /* ── Sync indicator ── */
    .sync-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 5px; }

    /* ── Stats ── */
    .marga-stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    .stat-card { background: #FFFDF8; border-radius: 10px; padding: 14px 18px; flex: 1 1 120px; border: 1px solid #E5DDD0; }
    .stat-num { font-size: 28px; font-weight: 700; color: #3A2E22; font-family: 'Cormorant Garamond', serif; }
    .stat-label { font-size: 11px; color: #8A7D6B; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }

    @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(6px)} }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 1s linear infinite; display: inline-block; }
  </style>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── Constants ────────────────────────────────────────────────
const SITE_PASSWORD  = "marga2025";
const SITE_AUTH_KEY  = "marga_site_auth";
const GITHUB_REPO    = "matsbprod/marga";
const GITHUB_RAW     = "https://raw.githubusercontent.com/matsbprod/marga/main";

const PHASES = [
  { id: "Mallställ och resning",                 label: "Mallställ och resning",                              color: "#5A6B7A" },
  { id: "CAD design och konstruktion",           label: "CAD design och konstruktion",                                color: "#8B7355" },
  { id: "Rivning och demontering",               label: "Rivning och demontering",          color: "#D4A76A" },
  { id: "Spant och bottenstockar",               label: "Spant och bottenstockar",                             color: "#5B7F6E" },
  { id: "Skrov och bordläggning",                label: "Skrov och bordläggning",                           color: "#7D6B91" },
  { id: "Virke och material",                    label: "Virke och material",             color: "#A67B5B" },
  { id: "Däck och överbyggnader",                label: "Däck och överbyggnader",                                color: "#6E7F8D" },
  { id: "Ytbehandling",                          label: "Ytbehandling",                            color: "#C49A6C" },
  { id: "Inredning",                             label: "Inredning",                      color: "#4A7C6F" },
  { id: "El och instrument",                     label: "El och instrument",                             color: "#C75B4A" },
  { id: "Övriga installationer",                 label: "Övriga installationer",                               color: "#5A7A8A" },
  { id: "Mast och bom",                          label: "Mast och bom",                               color: "#7A8A5A" },
  { id: "Motor",                                  label: "Motor",                                      color: "#6E5A7A" },
  { id: "Segel och rigg",                        label: "Segel och rigg",         color: "#8B6347" },
  { id: "Roder",                                 label: "Roder",      color: "#6B7A8B" },
  { id: "Köl",                                   label: "Köl",      color: "#6B7A8B" },
];

const STATUSES = [
  { id: "backlog",     label: "Att göra",  icon: "○" },
  { id: "in_progress", label: "Pågående",  icon: "◑" },
  { id: "done",        label: "Klart",     icon: "●" },
];

const FILE_TYPES = {
  image: { color: "#5B7F6E", icon: "🖼" },
  pdf:   { color: "#C75B4A", icon: "📄" },
  cad:   { color: "#5B6E8A", icon: "📐" },
  doc:   { color: "#8A6B5B", icon: "📝" },
  other: { color: "#8A7D6B", icon: "📎" },
};

function detectFileType(name = "") {
  const ext = name.split(".").pop().toLowerCase();
  if (["jpg","jpeg","png","gif","webp","svg","bmp"].includes(ext)) return "image";
  if (ext === "pdf") return "pdf";
  if (["dwg","dxf","step","stp","stl","3dm","iges","igs"].includes(ext)) return "cad";
  if (["doc","docx","xls","xlsx","txt","md"].includes(ext)) return "doc";
  return "other";
}

function isGithubUrl(url = "") { return url.includes("raw.githubusercontent.com"); }

// ── API helpers ──────────────────────────────────────────────
function getPassword() { return localStorage.getItem(SITE_AUTH_KEY) === "1" ? SITE_PASSWORD : ""; }

async function apiGet() {
  const res = await fetch("/api/marga-data", {
    headers: { "X-Marga-Password": getPassword() }
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function apiSave(data) {
  const res = await fetch("/api/marga-data", {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Marga-Password": getPassword() },
    body: JSON.stringify(data),
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function apiUpload(path, base64content, filename) {
  const res = await fetch("/api/marga-upload", {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Marga-Password": getPassword() },
    body: JSON.stringify({ path, content: base64content, message: `Uppladdning: ${filename}` }),
  });
  if (!res.ok) {
    const err = await res.json();
    throw new Error(err.error || `HTTP ${res.status}`);
  }
  return res.json();
}

// ── Toast ────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const el = document.getElementById("marga-toast");
  if (!el) return;
  el.textContent = msg;
  el.style.opacity = "1";
  el.style.transform = "translateY(0)";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.opacity = "0"; el.style.transform = "translateY(8px)"; }, 2500);
}

// ── Site Login ───────────────────────────────────────────────
function SiteLogin({ onAuth }) {
  const [pw, setPw] = useState("");
  const [err, setErr] = useState(false);
  const [shake, setShake] = useState(false);
  function attempt() {
    if (pw === SITE_PASSWORD) { localStorage.setItem(SITE_AUTH_KEY, "1"); onAuth(); }
    else { setErr(true); setShake(true); setPw(""); setTimeout(() => setShake(false), 500); }
  }
  return (
    <div className="marga-login">
      <div className="marga-login-box" style={{ animation: shake ? "shake 0.4s ease" : "none" }}>
        <div style={{ fontSize: 32, marginBottom: 8 }}>⚓</div>
        <div style={{ fontSize: 24, fontWeight: 700, color: "#3A2E22", marginBottom: 4, letterSpacing: "0.02em", fontFamily: "'Cormorant Garamond', serif" }}>Marga III</div>
        <div style={{ fontSize: 13, color: "#8A7D6B", marginBottom: 28 }}>Projektplanering</div>
        <input type="password" placeholder="Lösenord…" value={pw} autoFocus
          onChange={e => { setPw(e.target.value); setErr(false); }}
          onKeyDown={e => e.key === "Enter" && attempt()}
          className="marga-input" style={{ marginBottom: 8 }}
        />
        {err && <div style={{ fontSize: 12, color: "#C75B4A", marginBottom: 8, fontWeight: 600 }}>Fel lösenord</div>}
        <button onClick={attempt} className="marga-btn marga-btn-primary" style={{ width: "100%", padding: 11, fontSize: 14, letterSpacing: "0.04em" }}>
          Logga in
        </button>
      </div>
    </div>
  );
}

// ── Lightbox ─────────────────────────────────────────────────
function Lightbox({ src, caption, images, currentIndex, onClose, onNavigate }) {
  useEffect(() => {
    const handler = e => {
      if (e.key === "Escape") onClose();
      if (e.key === "ArrowRight" && images?.length > 1) onNavigate(1);
      if (e.key === "ArrowLeft"  && images?.length > 1) onNavigate(-1);
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [onClose, onNavigate, images]);

  return (
    <div className="marga-lightbox" onClick={onClose}>
      <div onClick={e => e.stopPropagation()} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 12, maxWidth: "92vw" }}>
        <img src={src} alt={caption} />
        {caption && <div style={{ color: "#C4B89E", fontSize: 13 }}>{caption}</div>}
        {images?.length > 1 && (
          <div style={{ display: "flex", gap: 16 }}>
            <button onClick={() => onNavigate(-1)} style={{ background: "rgba(255,255,255,0.1)", border: "none", color: "#fff", padding: "6px 14px", borderRadius: 6, cursor: "pointer", fontSize: 18 }}>‹</button>
            <span style={{ color: "#8A7D6B", fontSize: 12, alignSelf: "center" }}>{currentIndex + 1} / {images.length}</span>
            <button onClick={() => onNavigate(1)}  style={{ background: "rgba(255,255,255,0.1)", border: "none", color: "#fff", padding: "6px 14px", borderRadius: 6, cursor: "pointer", fontSize: 18 }}>›</button>
          </div>
        )}
      </div>
    </div>
  );
}

// ── Upload Dropzone ───────────────────────────────────────────
function UploadDropzone({ targetPath, onUploaded }) {
  const [queue, setQueue] = useState([]);
  const [dragging, setDragging] = useState(false);
  const inputId = "marga-file-" + targetPath.replace(/\//g, "-");

  function addFiles(files) {
    setQueue(prev => [...prev, ...Array.from(files).map(f => ({ file: f, status: "idle", msg: "" }))]);
  }

  async function uploadOne(idx) {
    const f = queue[idx].file;
    setQueue(prev => prev.map((e,i) => i===idx ? {...e, status:"uploading"} : e));
    try {
      const base64 = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = e => res(e.target.result.split(",")[1]);
        r.onerror = () => rej(new Error("Läsfel"));
        r.readAsDataURL(f);
      });
      const path = `${targetPath}/${f.name}`;
      const result = await apiUpload(path, base64, f.name);
      setQueue(prev => prev.map((e,i) => i===idx ? {...e, status:"done"} : e));
      if (onUploaded) onUploaded({ url: result.url, name: f.name, type: detectFileType(f.name), addedAt: new Date().toISOString() });
    } catch(e) {
      setQueue(prev => prev.map((e2,i) => i===idx ? {...e2, status:"error", msg:e.message} : e2));
    }
  }

  async function uploadAll() {
    for (let i = 0; i < queue.length; i++) {
      if (queue[i].status === "idle") await uploadOne(i);
    }
  }

  const pendingCount = queue.filter(e => e.status === "idle").length;
  const doneCount = queue.filter(e => e.status === "done").length;

  return (
    <div>
      <div className={`marga-dropzone${dragging ? " drag" : ""}`}
        onDragOver={e => { e.preventDefault(); setDragging(true); }}
        onDragLeave={() => setDragging(false)}
        onDrop={e => { e.preventDefault(); setDragging(false); if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files); }}
        onClick={() => document.getElementById(inputId)?.click()}>
        <input id={inputId} type="file" multiple style={{ display: "none" }}
          onChange={e => { if (e.target.files.length) addFiles(e.target.files); e.target.value = ""; }} />
        <div style={{ fontSize: 18, marginBottom: 2 }}>↑</div>
        <div style={{ fontSize: 12, color: "#8A7D6B" }}>Dra hit eller klicka — flera filer OK</div>
      </div>

      {queue.length > 0 && (
        <div style={{ marginTop: 6, display: "flex", flexDirection: "column", gap: 3 }}>
          {queue.map((e, i) => (
            <div key={i} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11, padding: "3px 6px",
              background: e.status==="done" ? "rgba(91,127,110,0.07)" : e.status==="error" ? "rgba(199,91,74,0.07)" : "#FAF6EF", borderRadius: 5 }}>
              <span style={{ flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", color: "#3A2E22" }}>{e.file.name}</span>
              <span style={{ fontSize: 10, flexShrink: 0, color: e.status==="done" ? "#5B7F6E" : e.status==="error" ? "#C75B4A" : e.status==="uploading" ? "#C9A84C" : "#A89878" }}>
                {e.status==="uploading" ? "laddar…" : e.status==="done" ? "✓" : e.status==="error" ? `✗ ${e.msg}` : `${(e.file.size/1024).toFixed(0)} KB`}
              </span>
              {e.status === "idle" && <button onClick={() => setQueue(prev => prev.filter((_,j)=>j!==i))} style={{ fontSize: 10, color: "#A89878", background: "none", border: "none", cursor: "pointer" }}>✕</button>}
            </div>
          ))}
        </div>
      )}
      {pendingCount > 0 && (
        <button onClick={uploadAll} className="marga-btn marga-btn-primary" style={{ marginTop: 6, width: "100%", padding: "8px 0", fontSize: 12 }}>
          ↑ Ladda upp {pendingCount} {pendingCount === 1 ? "fil" : "filer"}
        </button>
      )}
      {doneCount > 0 && pendingCount === 0 && (
        <button onClick={() => setQueue([])} className="marga-btn marga-btn-secondary" style={{ marginTop: 6, width: "100%", padding: "6px 0", fontSize: 11 }}>
          Rensa ({doneCount} uppladdade)
        </button>
      )}
    </div>
  );
}

// ── File Attachments ─────────────────────────────────────────
function FileAttachments({ files, onChange, onPreview, taskTitle }) {
  function slugify(str) {
    return (str || "okant").toLowerCase()
      .replace(/å/g,"a").replace(/ä/g,"a").replace(/ö/g,"o")
      .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0, 40) || "okant";
  }
  const targetPath = "BILDER/uppgifter/" + slugify(taskTitle);

  return (
    <div style={{ marginTop: 14 }}>
      <div className="marga-label" style={{ display: "flex", alignItems: "center", gap: 6 }}>
        <svg width="14" height="14" viewBox="0 0 20 20" fill="none"><path d="M10.5 2.5l-6 6a4.24 4.24 0 006 6l6.5-6.5a2.83 2.83 0 00-4-4L6.5 10.5a1.41 1.41 0 002 2L14 7" stroke="#8A7D6B" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
        Bifogade filer ({files.length})
      </div>

      {files.length > 0 && (
        <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 10 }}>
          {files.map((f, i) => {
            const typeDef = FILE_TYPES[f.type || detectFileType(f.name || f.url)] || FILE_TYPES.other;
            const isImg = (f.type || detectFileType(f.name || f.url)) === "image";
            return (
              <div key={i} className="file-card">
                {isImg && isGithubUrl(f.url) ? (
                  <img src={f.url} alt={f.name}
                    style={{ width: 36, height: 36, borderRadius: 5, objectFit: "cover", cursor: "pointer", border: "1px solid #E5DDD0" }}
                    onClick={() => onPreview(f.url, f.name)}
                    onError={e => { e.target.style.display="none"; }}
                  />
                ) : (
                  <div className="file-icon" style={{ background: typeDef.color }}>{typeDef.icon}</div>
                )}
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 12, fontWeight: 600, color: "#3A2E22", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{f.name}</div>
                  <div style={{ fontSize: 10, color: "#A89878" }}>{f.addedAt ? new Date(f.addedAt).toLocaleDateString("sv-SE") : ""}</div>
                </div>
                <button onClick={() => onChange(files.filter((_,j) => j !== i))}
                  style={{ fontSize: 11, color: "#A89878", background: "none", border: "none", cursor: "pointer", padding: "0 4px", flexShrink: 0 }}>✕</button>
              </div>
            );
          })}
        </div>
      )}

      <UploadDropzone targetPath={targetPath} onUploaded={f => onChange([...files, f])} />
    </div>
  );
}

// ── Task Modal ───────────────────────────────────────────────
function TaskModal({ task, phases, onSave, onDelete, onClose, onPreview }) {
  const [form, setForm] = useState({
    title: task.title || "",
    phase: task.phase || phases[0]?.id,
    startWeek: task.startWeek || 1,
    duration: task.duration || 1,
    status: task.status || "todo",
    notes: task.notes || "",
    files: task.files || [],
  });

  function save() {
    if (!form.title.trim()) return;
    onSave({ ...task, ...form, startWeek: +form.startWeek, duration: +form.duration });
  }

  return (
    <div className="marga-modal-bg" onClick={onClose}>
      <div className="marga-modal" onClick={e => e.stopPropagation()}>
        <h2>{task.id ? "Redigera uppgift" : "Ny uppgift"}</h2>

        <div className="marga-field">
          <label className="marga-label">Titel</label>
          <input className="marga-input" value={form.title} onChange={e => setForm({...form, title: e.target.value})} autoFocus />
        </div>

        <div style={{ display: "flex", gap: 12 }}>
          <div className="marga-field" style={{ flex: 2 }}>
            <label className="marga-label">Fas</label>
            <select className="marga-input" value={form.phase} onChange={e => setForm({...form, phase: e.target.value})}>
              {phases.map(p => <option key={p.id} value={p.id}>{p.label}</option>)}
            </select>
          </div>
          <div className="marga-field" style={{ flex: 1 }}>
            <label className="marga-label">Startvecka</label>
            <input className="marga-input" type="number" min="1" value={form.startWeek} onChange={e => setForm({...form, startWeek: e.target.value})} />
          </div>
        </div>

        <div style={{ display: "flex", gap: 12 }}>
          <div className="marga-field" style={{ flex: 1 }}>
            <label className="marga-label">Varaktighet (veckor)</label>
            <input className="marga-input" type="number" min="1" value={form.duration} onChange={e => setForm({...form, duration: e.target.value})} />
          </div>
          <div className="marga-field" style={{ flex: 1 }}>
            <label className="marga-label">Status</label>
            <select className="marga-input" value={form.status} onChange={e => setForm({...form, status: e.target.value})}>
              {STATUSES.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
            </select>
          </div>
        </div>

        <div className="marga-field">
          <label className="marga-label">Anteckningar</label>
          <textarea className="marga-input" rows={3} value={form.notes} onChange={e => setForm({...form, notes: e.target.value})} style={{ resize: "vertical" }} />
        </div>

        <FileAttachments files={form.files} onChange={files => setForm({...form, files})} onPreview={onPreview} taskTitle={form.title} />

        <div style={{ display: "flex", gap: 8, marginTop: 20, justifyContent: "space-between" }}>
          <div>
            {task.id && <button className="marga-btn marga-btn-danger" onClick={() => onDelete(task.id)}>Ta bort</button>}
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <button className="marga-btn marga-btn-secondary" onClick={onClose}>Avbryt</button>
            <button className="marga-btn marga-btn-primary" onClick={save}>Spara</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Kanban ───────────────────────────────────────────────────
function KanbanCard({ task, phases, onEdit, onDragStart, onDragOver, onDrop, onPreview }) {
  const phase = phases.find(p => p.id === task.phase);
  const files = task.files || [];
  const imageFiles = files.filter(f => (f.type || detectFileType(f.name || f.url)) === "image" && isGithubUrl(f.url));
  const nonImageCount = files.length - imageFiles.length;
  const allImgs = imageFiles.map(f => ({ src: f.url, caption: f.name }));

  return (
    <div className="kanban-card" draggable
      style={{ borderLeftColor: phase?.color || "#aaa" }}
      onDragStart={e => { e.dataTransfer.setData("taskId", String(task.id)); onDragStart(task.id); }}
      onDragOver={e => { e.preventDefault(); e.stopPropagation(); if (onDragOver) onDragOver(task.id); }}
      onDrop={e => { e.preventDefault(); e.stopPropagation(); if (onDrop) onDrop(e); }}
      onClick={() => onEdit(task)}>
      <div style={{ fontWeight: 600, color: "#3A2E22", marginBottom: 4, fontSize: 13, lineHeight: 1.3 }}>{task.title}</div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <span style={{ fontSize: 10, fontWeight: 700, color: phase?.color, textTransform: "uppercase", letterSpacing: "0.05em" }}>{phase?.label}</span>
        {nonImageCount > 0 && <span style={{ fontSize: 10, color: "#A89878" }}>📎 {nonImageCount}</span>}
      </div>
      {task.notes && <div style={{ fontSize: 11, color: "#8A7D6B", marginTop: 4, lineHeight: 1.35 }}>{task.notes.length > 60 ? task.notes.slice(0,60)+"…" : task.notes}</div>}
      {imageFiles.length > 0 && (
        <div style={{ display: "flex", gap: 4, marginTop: 8, flexWrap: "wrap" }} onClick={e => e.stopPropagation()}>
          {imageFiles.slice(0,4).map((f, i) => (
            <div key={i} style={{ position: "relative" }}>
              <img src={f.url} alt={f.name}
                onClick={e => { e.stopPropagation(); onPreview(f.url, f.name, allImgs, i); }}
                style={{ width: 48, height: 48, objectFit: "cover", borderRadius: 5, border: "1.5px solid #E5DDD0", cursor: "zoom-in", display: "block" }}
                onError={e => { e.target.style.display = "none"; }} />
              {i === 3 && imageFiles.length > 4 && (
                <div onClick={e => { e.stopPropagation(); onPreview(imageFiles[3].url, imageFiles[3].name, allImgs, 3); }}
                  style={{ position: "absolute", inset: 0, background: "rgba(40,30,20,0.55)", borderRadius: 5, display: "flex", alignItems: "center", justifyContent: "center", cursor: "zoom-in" }}>
                  <span style={{ color: "#fff", fontSize: 11, fontWeight: 700 }}>+{imageFiles.length-3}</span>
                </div>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function KanbanBoard({ tasks, phases, onEdit, onDrop, onReorder, onPreview }) {
  const [dragOverStatus, setDragOverStatus] = useState(null);
  const [draggingId, setDraggingId] = useState(null);
  const dragOverCard = useRef(null);

  return (
    <div className="kanban-board">
      {STATUSES.map(s => {
        const colTasks = tasks.filter(t => t.status === s.id);
        return (
          <div key={s.id} className="kanban-col"
            style={{ background: dragOverStatus === s.id ? "rgba(90,122,138,0.07)" : "transparent" }}
            onDragOver={e => { e.preventDefault(); setDragOverStatus(s.id); }}
            onDragLeave={() => setDragOverStatus(null)}
            onDrop={e => { e.preventDefault(); setDragOverStatus(null); onDrop(parseInt(e.dataTransfer.getData("taskId")), s.id); }}>
            <div className="kanban-col-header">
              <span style={{ fontSize: 15 }}>{s.icon}</span>
              <span style={{ fontWeight: 700, fontSize: 13, color: "#3A2E22", textTransform: "uppercase", letterSpacing: "0.03em" }}>{s.label}</span>
              <span style={{ marginLeft: "auto", fontSize: 11, background: "#E5DDD0", borderRadius: 10, padding: "1px 8px", color: "#6B5D4E", fontWeight: 600 }}>{colTasks.length}</span>
            </div>
            <div style={{ minHeight: 40 }}>
              {colTasks.map(t => (
                <KanbanCard key={t.id} task={t} phases={phases} onEdit={onEdit}
                  onDragStart={setDraggingId} onPreview={onPreview}
                  onDragOver={cardId => { dragOverCard.current = cardId; }}
                  onDrop={e => {
                    const draggedId = parseInt(e.dataTransfer.getData("taskId"));
                    if (onReorder && dragOverCard.current && draggedId !== dragOverCard.current) {
                      onReorder(draggedId, dragOverCard.current, s.id);
                    }
                    dragOverCard.current = null;
                  }} />
              ))}
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ── Gantt ────────────────────────────────────────────────────
function GanttChart({ tasks, phases }) {
  const totalWeeks = Math.max(20, ...tasks.map(t => (t.startWeek || 1) + (t.duration || 1)));
  const weeks = Array.from({ length: totalWeeks }, (_, i) => i + 1);

  return (
    <div className="gantt-wrap">
      {/* Header */}
      <div style={{ display: "flex", borderBottom: "2px solid #E5DDD0", marginBottom: 4 }}>
        <div style={{ width: 180, flexShrink: 0 }} />
        <div style={{ flex: 1, display: "flex" }}>
          {weeks.map(w => (
            <div key={w} style={{ flex: 1, textAlign: "center", fontSize: 9, color: "#A89878", padding: "4px 0", borderLeft: "1px solid #F0EBE2" }}>
              {w % 4 === 1 ? `V${w}` : ""}
            </div>
          ))}
        </div>
      </div>
      {/* Rows */}
      {tasks.map(task => {
        const phase = phases.find(p => p.id === task.phase);
        const start = Math.max(1, task.startWeek || 1);
        const dur   = Math.max(1, task.duration || 1);
        const left  = ((start - 1) / totalWeeks) * 100;
        const width = (dur / totalWeeks) * 100;
        return (
          <div key={task.id} className="gantt-row">
            <div className="gantt-label" title={task.title}>{task.title.length > 22 ? task.title.slice(0,22)+"…" : task.title}</div>
            <div className="gantt-bar-area">
              <div className="gantt-bar" style={{ left: `${left}%`, width: `${width}%`, background: phase?.color || "#8A7D6B" }} title={`V${start}–V${start+dur-1}`} />
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ── Stats ────────────────────────────────────────────────────
function Stats({ tasks }) {
  const total = tasks.length;
  const done  = tasks.filter(t => t.status === "done").length;
  const pct   = total ? Math.round((done/total)*100) : 0;
  return (
    <div className="marga-stats">
      {[
        { num: total, label: "Uppgifter totalt" },
        { num: tasks.filter(t=>t.status==="ongoing").length, label: "Pågående" },
        { num: done, label: "Klara" },
        { num: `${pct}%`, label: "Färdigställt" },
      ].map((s,i) => (
        <div key={i} className="stat-card">
          <div className="stat-num">{s.num}</div>
          <div className="stat-label">{s.label}</div>
        </div>
      ))}
    </div>
  );
}

// ── Main App ─────────────────────────────────────────────────
function App() {
  const [tasks, setTasks]         = useState([]);
  const [view, setView]           = useState("board"); // board | gantt | stats
  const [editingTask, setEditing] = useState(null);
  const [lightbox, setLightbox]   = useState(null);
  const [syncStatus, setSyncStatus] = useState("idle"); // idle | saving | error
  const [filter, setFilter]       = useState("");
  const saveTimer = useRef(null);

  // Load on mount
  useEffect(() => {
    apiGet().then(data => {
      if (data?.tasks) setTasks(data.tasks);
    }).catch(e => {
      console.warn("Kunde inte ladda data:", e);
      setSyncStatus("error");
    });
  }, []);

  // Auto-save with debounce
  function saveTasks(newTasks) {
    setTasks(newTasks);
    setSyncStatus("saving");
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      try {
        await apiSave({ tasks: newTasks });
        setSyncStatus("idle");
        showToast("Sparat ✓");
      } catch(e) {
        setSyncStatus("error");
        showToast("Fel vid sparning");
      }
    }, 800);
  }

  function handleSave(task) {
    const isNew = !task.id;
    const updated = isNew
      ? [...tasks, { ...task, id: Date.now() }]
      : tasks.map(t => t.id === task.id ? task : t);
    saveTasks(updated);
    setEditing(null);
    showToast(isNew ? "Uppgift skapad ✓" : "Uppgift uppdaterad ✓");
  }

  function handleDelete(id) {
    if (!confirm("Ta bort uppgiften?")) return;
    saveTasks(tasks.filter(t => t.id !== id));
    setEditing(null);
  }

  function handleDrop(taskId, newStatus) {
    saveTasks(tasks.map(t => t.id === taskId ? {...t, status: newStatus} : t));
  }

  function handleReorder(draggedId, targetId, status) {
    const arr = [...tasks];
    const di = arr.findIndex(t => t.id === draggedId);
    const ti = arr.findIndex(t => t.id === targetId);
    if (di < 0 || ti < 0) return;
    const [moved] = arr.splice(di, 1);
    moved.status = status;
    arr.splice(ti, 0, moved);
    saveTasks(arr);
  }

  function handleExport() {
    const blob = new Blob([JSON.stringify(tasks, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "marga-iii-backup.json"; a.click();
    URL.revokeObjectURL(url);
    showToast("Backup exporterad ✓");
  }

  function handleImport() {
    const input = document.createElement("input");
    input.type = "file"; input.accept = ".json";
    input.onchange = e => {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          let imported = JSON.parse(ev.target.result);
          if (!Array.isArray(imported) && Array.isArray(imported?.tasks)) imported = imported.tasks;
          if (!Array.isArray(imported) || !imported.length || !imported[0].title) { showToast("Ogiltig fil ✗"); return; }
          if (tasks.length && !confirm(`Ersätta ${tasks.length} befintliga uppgifter med ${imported.length} från filen?`)) return;
          const cleaned = imported.map(t => ({ ...t, files: (t.files || []).map(f => ({ ...f, type: f.type || detectFileType(f.name || f.url) })) }));
          saveTasks(cleaned);
          showToast(`${cleaned.length} uppgifter importerade ✓`);
        } catch { showToast("Kunde inte läsa filen ✗"); }
      };
      reader.readAsText(file);
    };
    input.click();
  }

  function openLightbox(src, caption, images, idx) {
    setLightbox({ src, caption, images: images || [{ src, caption }], currentIndex: idx || 0 });
  }

  function navigateLightbox(dir) {
    if (!lightbox?.images) return;
    const next = (lightbox.currentIndex + dir + lightbox.images.length) % lightbox.images.length;
    const img  = lightbox.images[next];
    setLightbox({ ...lightbox, src: img.src, caption: img.caption, currentIndex: next });
  }

  const filtered = filter
    ? tasks.filter(t => t.title.toLowerCase().includes(filter.toLowerCase()) || (t.notes||"").toLowerCase().includes(filter.toLowerCase()))
    : tasks;

  const syncColor = syncStatus === "saving" ? "#C9A84C" : syncStatus === "error" ? "#C75B4A" : "#5B7F6E";
  const syncLabel = syncStatus === "saving" ? "Sparar…" : syncStatus === "error" ? "Synkfel" : "Synkad";

  return (
    <div className="marga-app">
      {/* Header */}
      <div className="marga-header">
        <div>
          <div className="marga-header-sub">Projektplanering</div>
          <h1>Marga III</h1>
        </div>
        <div style={{ display: "flex", gap: 6, marginLeft: "auto", alignItems: "center", flexWrap: "wrap" }}>
          <span style={{ fontSize: 11, color: "#8A7D6B", display: "flex", alignItems: "center" }}>
            <span className="sync-dot" style={{ background: syncColor }} />
            {syncLabel}
          </span>
          <button className="marga-nav-btn" onClick={() => setEditing({ files: [] })}>+ Ny uppgift</button>
          <button className="marga-nav-btn" onClick={handleExport}>↓ Backup</button>
          <button className="marga-nav-btn" onClick={handleImport}>↑ Importera</button>
          <button className="marga-nav-btn" onClick={() => { localStorage.removeItem(SITE_AUTH_KEY); location.reload(); }}>⎋ Logga ut</button>
        </div>
      </div>

      {/* Tabs + filter */}
      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 4 }}>
        <div className="marga-tabs" style={{ flex: 1 }}>
          {[["board","Tavla"],["gantt","Gantt-schema"],["stats","Statistik"]].map(([id, label]) => (
            <button key={id} className={`marga-tab${view===id?" active":""}`} onClick={() => setView(id)}>{label}</button>
          ))}
        </div>
        <input placeholder="Sök uppgift…" value={filter} onChange={e => setFilter(e.target.value)}
          style={{ padding: "6px 10px", borderRadius: 7, border: "1.5px solid #DDD5C8", background: "#FAF6EF", fontSize: 12, color: "#3A2E22", outline: "none", width: 160 }} />
      </div>

      {/* Views */}
      {view === "board" && (
        <KanbanBoard tasks={filtered} phases={PHASES}
          onEdit={setEditing} onDrop={handleDrop} onReorder={handleReorder}
          onPreview={(src, cap, imgs, idx) => openLightbox(src, cap, imgs, idx)} />
      )}
      {view === "gantt" && <GanttChart tasks={filtered} phases={PHASES} />}
      {view === "stats" && <Stats tasks={tasks} />}

      {/* Modals */}
      {editingTask && (
        <TaskModal task={editingTask} phases={PHASES}
          onSave={handleSave} onDelete={handleDelete}
          onClose={() => setEditing(null)}
          onPreview={(src, cap) => openLightbox(src, cap)} />
      )}
      {lightbox && (
        <Lightbox src={lightbox.src} caption={lightbox.caption}
          images={lightbox.images} currentIndex={lightbox.currentIndex}
          onClose={() => setLightbox(null)} onNavigate={navigateLightbox} />
      )}

      {/* Toast */}
      <div id="marga-toast" style={{
        position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%) translateY(8px)",
        background: "#3A2E22", color: "#C4B89E", padding: "8px 20px", borderRadius: 8,
        fontSize: 13, fontWeight: 600, opacity: 0, transition: "opacity 0.2s, transform 0.2s",
        pointerEvents: "none", zIndex: 3000,
      }} />
    </div>
  );
}

// ── Root ─────────────────────────────────────────────────────
function Root() {
  const [authed, setAuthed] = useState(() => localStorage.getItem(SITE_AUTH_KEY) === "1");
  if (!authed) return <SiteLogin onAuth={() => setAuthed(true)} />;
  return <App />;
}

ReactDOM.createRoot(document.getElementById("marga-root")).render(<Root />);
</script>
</body>
</html>
